  <!-- 7. WHITEOUT & REDACTION ENGINE SCRIPT      -->
  <!-- ========================================== -->
  <script>
    // Global Application State
    let selectedFile = null;
    let fileArrayBuffer = null;
    let pdfDocObj = null;
    let redactedPdfBlobUrl = null;

    // Tool Modes: 'blackout' | 'whiteout' | 'eraser' | 'scrubber'
    let currentMode = 'blackout'; 
    let brushSize = 20; // 5px to 50px

    // Render Scale
    const RENDER_SCALE = 1.5;

    // Array of page states
    // Each element: { pageNum, width, height, rasterCanvas, rasterCtx, overlayCanvas, overlayCtx, boxes: [] }
    let pageStates = [];

    // Global History Stack for Undo/Redo
    // Entries: { pageIndex, type: 'boxes_change' | 'raster_stroke', boxSnapshot: [], rasterSnapshotImageData }
    let undoStack = [];
    let redoStack = [];

    // DOM Elements
    const fileInput = document.getElementById('pdf-file-input');
    const emptyDropzone = document.getElementById('empty-dropzone');
    const workbenchPanel = document.getElementById('workbench-panel');
    const processingProgressBox = document.getElementById('processing-progress-box');
    const successPanel = document.getElementById('success-panel');

    const fileNameDisplay = document.getElementById('file-name-display');
    const fileMetaDisplay = document.getElementById('file-meta-display');
    const continuousViewerContainer = document.getElementById('continuous-viewer-container');

    const toolBlackoutBtn = document.getElementById('tool-blackout-btn');
    const toolWhiteoutBtn = document.getElementById('tool-whiteout-btn');
    const toolEraserBtn = document.getElementById('tool-eraser-btn');
    const toolScrubberBtn = document.getElementById('tool-scrubber-btn');

    const undoActionBtn = document.getElementById('undo-action-btn');
    const redoActionBtn = document.getElementById('redo-action-btn');
    const clearAllMarksBtn = document.getElementById('clear-all-marks-btn');

    const brushSizeSlider = document.getElementById('brush-size-slider');
    const brushSizeVal = document.getElementById('brush-size-val');
    const liveBrushCircleIndicator = document.getElementById('live-brush-circle-indicator');

    const outputFilenameInput = document.getElementById('output-filename-input');
    const applyRedactionBtn = document.getElementById('apply-redaction-btn');

    const progressBarFill = document.getElementById('progress-bar-fill');
    const progressStatusText = document.getElementById('progress-status-text');
    const progressPercentText = document.getElementById('progress-percent-text');

    const successFileNameDisplay = document.getElementById('success-file-name-display');
    const successFileStatsDisplay = document.getElementById('success-file-stats-display');
    const downloadRedactedPdfBtn = document.getElementById('download-redacted-pdf-btn');
    const redactAnotherBtn = document.getElementById('redact-another-btn');

    // Tool Mode Selection Mechanics
    const modeButtons = [
      { btn: toolBlackoutBtn, mode: 'blackout' },
      { btn: toolWhiteoutBtn, mode: 'whiteout' },
      { btn: toolEraserBtn, mode: 'eraser' },
      { btn: toolScrubberBtn, mode: 'scrubber' }
    ];

    function setToolMode(mode) {
      currentMode = mode;
      modeButtons.forEach(item => {
        if (item.mode === mode) {
          item.btn.classList.add('active');
        } else {
          item.btn.classList.remove('active');
        }
      });
    }

    modeButtons.forEach(item => {
      item.btn.addEventListener('click', () => setToolMode(item.mode));
    });

    // Brush Size Slider Listener
    brushSizeSlider.addEventListener('input', (e) => {
      brushSize = parseInt(e.target.value, 10);
      brushSizeVal.textContent = `${brushSize}px`;
      liveBrushCircleIndicator.style.width = `${brushSize}px`;
      liveBrushCircleIndicator.style.height = `${brushSize}px`;
    });

    // File Selection & Drag Drop
    fileInput.addEventListener('change', handleFileSelection);

    ['dragover', 'dragenter'].forEach(eventName => {
      emptyDropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        emptyDropzone.classList.add('dragover-active');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      emptyDropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        emptyDropzone.classList.remove('dragover-active');
      });
    });

    emptyDropzone.addEventListener('drop', (e) => {
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        fileInput.files = e.dataTransfer.files;
        handleFileSelection();
      }
    });

    async function handleFileSelection() {
      if (!fileInput.files || fileInput.files.length === 0) return;

      selectedFile = fileInput.files[0];
      if (selectedFile.type !== 'application/pdf' && !selectedFile.name.toLowerCase().endsWith('.pdf')) {
        alert('Please select a valid PDF file.');
        return;
      }

      const sizeMB = (selectedFile.size / (1024 * 1024)).toFixed(2);
      fileNameDisplay.textContent = selectedFile.name;
      fileMetaDisplay.textContent = `${sizeMB} MB • Preparing document pages...`;

      // Clean default export filename
      const baseName = selectedFile.name.replace(/\.pdf$/i, '');
      outputFilenameInput.value = `SlowPDF_Redacted_${baseName}`;

      emptyDropzone.classList.add('hidden');
      workbenchPanel.classList.remove('hidden');
      continuousViewerContainer.innerHTML = '<p class="text-sm text-stone-500 font-bold animate-pulse">Rendering document pages into high-resolution canvas memory...</p>';

      try {
        fileArrayBuffer = await selectedFile.arrayBuffer();
        
        // Render PDF pages using PDF.js with ArrayBuffer copy protection
        const loadingTask = pdfjsLib.getDocument({ data: fileArrayBuffer.slice(0) });
        pdfDocObj = await loadingTask.promise;

        const pageCount = pdfDocObj.numPages;
        fileMetaDisplay.textContent = `${sizeMB} MB • ${pageCount} Page${pageCount > 1 ? 's' : ''} • Ready for Redaction`;

        pageStates = [];
        undoStack = [];
        redoStack = [];
        updateHistoryButtons();

        continuousViewerContainer.innerHTML = '';

        for (let i = 1; i <= pageCount; i++) {
          await renderPageCard(i);
        }

      } catch (err) {
        console.error('Error opening PDF:', err);
        alert('Failed to load PDF file: ' + err.message);
        workbenchPanel.classList.add('hidden');
        emptyDropzone.classList.remove('hidden');
      }
    }

    // Render an individual page card with Dual-Layer Canvas
    async function renderPageCard(pageNum) {
      const page = await pdfDocObj.getPage(pageNum);
      const dpr = window.devicePixelRatio || 1;
      const targetScale = 2.0;
      const baseViewport = page.getViewport({ scale: 1.2 });
      const viewport = page.getViewport({ scale: 1.2 * targetScale * dpr });

      const card = document.createElement('div');
      card.className = 'w-full max-w-3xl flex flex-col items-center space-y-2';

      const pagePill = document.createElement('div');
      pagePill.className = 'px-3 py-1 rounded-full bg-stone-200/80 dark:bg-stone-800 text-stone-700 dark:text-stone-300 text-xs font-bold shadow-2xs';
      pagePill.textContent = `Page ${pageNum} of ${pdfDocObj.numPages}`;

      const wrapper = document.createElement('div');
      wrapper.className = 'page-canvas-wrapper max-w-full';
      wrapper.style.width = `${Math.floor(baseViewport.width)}px`;
      wrapper.style.height = `${Math.floor(baseViewport.height)}px`;

      // Layer 1: Base & Pixel Scrubber Raster Canvas
      const rasterCanvas = document.createElement('canvas');
      rasterCanvas.className = 'page-raster-canvas';
      rasterCanvas.width = Math.floor(viewport.width);
      rasterCanvas.height = Math.floor(viewport.height);
      rasterCanvas.style.width = `${Math.floor(baseViewport.width)}px`;
      rasterCanvas.style.height = `${Math.floor(baseViewport.height)}px`;
      rasterCanvas.style.imageRendering = '-webkit-optimize-contrast';
      rasterCanvas.style.imageRendering = 'crisp-edges';
      const rasterCtx = rasterCanvas.getContext('2d');

      // Render PDF.js onto raster canvas
      await page.render({ canvasContext: rasterCtx, viewport: viewport }).promise;

      // Layer 2: Overlay Canvas for Vector Masks & Live Scrubber Preview
      const overlayCanvas = document.createElement('canvas');
      overlayCanvas.className = 'page-overlay-canvas';
      overlayCanvas.width = Math.floor(viewport.width);
      overlayCanvas.height = Math.floor(viewport.height);
      overlayCanvas.style.width = `${Math.floor(baseViewport.width)}px`;
      overlayCanvas.style.height = `${Math.floor(baseViewport.height)}px`;
      overlayCanvas.style.imageRendering = '-webkit-optimize-contrast';
      overlayCanvas.style.imageRendering = 'crisp-edges';
      const overlayCtx = overlayCanvas.getContext('2d');

      // Live Brush Cursor Element
      const brushCursor = document.createElement('div');
      brushCursor.className = 'brush-cursor-preview';
      wrapper.appendChild(brushCursor);

      wrapper.appendChild(rasterCanvas);
      wrapper.appendChild(overlayCanvas);
      card.appendChild(pagePill);
      card.appendChild(wrapper);

      continuousViewerContainer.appendChild(card);

      const pageState = {
        pageNum,
        width: Math.floor(viewport.width),
        height: Math.floor(viewport.height),
        rasterCanvas,
        rasterCtx,
        overlayCanvas,
        overlayCtx,
        brushCursor,
        boxes: [] // { id, type: 'blackout'|'whiteout', x, y, w, h }
      };

      pageStates.push(pageState);

      // Attach Canvas Pointer / Touch Event Listeners
      setupCanvasInteractions(pageState);
    }

    // Attach Pointer & Draw Mechanics to Overlay Canvas
    function setupCanvasInteractions(pageState) {
      const { overlayCanvas, overlayCtx, rasterCanvas, rasterCtx, brushCursor } = pageState;

      let isDrawing = false;
      let startX = 0;
      let startY = 0;
      let currentDragBox = null;

      // Scrubber Freehand State
      let isScrubbing = false;
      let lastX = 0;
      let lastY = 0;

      function getCanvasCoords(e) {
        const rect = overlayCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scaleX = overlayCanvas.width / rect.width;
        const scaleY = overlayCanvas.height / rect.height;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      }

      // Pointer Motion / Cursor Preview
      overlayCanvas.addEventListener('mousemove', (e) => {
        const coords = getCanvasCoords(e);
        if (currentMode === 'scrubber') {
          brushCursor.style.display = 'block';
          brushCursor.style.width = `${brushSize}px`;
          brushCursor.style.height = `${brushSize}px`;
          brushCursor.style.left = `${coords.x / RENDER_SCALE * (overlayCanvas.clientWidth / (overlayCanvas.width / RENDER_SCALE))}px`;
          brushCursor.style.top = `${coords.y / RENDER_SCALE * (overlayCanvas.clientHeight / (overlayCanvas.height / RENDER_SCALE))}px`;
        } else if (currentMode === 'eraser') {
          brushCursor.style.display = 'none';
          // Highlight hover box
          redrawOverlay(pageState, coords);
        } else {
          brushCursor.style.display = 'none';
        }
      });

      overlayCanvas.addEventListener('mouseleave', () => {
        brushCursor.style.display = 'none';
        if (currentMode === 'eraser') {
          redrawOverlay(pageState);
        }
      });

      // Pointer Down
      function handleStart(e) {
        e.preventDefault();
        const coords = getCanvasCoords(e);

        if (currentMode === 'blackout' || currentMode === 'whiteout') {
          isDrawing = true;
          startX = coords.x;
          startY = coords.y;
          currentDragBox = {
            id: Date.now() + Math.random(),
            type: currentMode,
            x: startX,
            y: startY,
            w: 0,
            h: 0
          };
        } else if (currentMode === 'scrubber') {
          isScrubbing = true;
          lastX = coords.x;
          lastY = coords.y;

          // Save raster snapshot before scrubbing
          pushUndoState(pageState.pageNum - 1, 'raster_stroke', rasterCtx.getImageData(0, 0, rasterCanvas.width, rasterCanvas.height));

          // Draw initial circle dot
          rasterCtx.beginPath();
          rasterCtx.fillStyle = '#FFFFFF';
          rasterCtx.arc(coords.x, coords.y, brushSize / 2, 0, Math.PI * 2);
          rasterCtx.fill();

        } else if (currentMode === 'eraser') {
          // Check if clicked inside a box
          const hitIdx = pageState.boxes.findIndex(box => {
            return coords.x >= box.x && coords.x <= box.x + box.w &&
                   coords.y >= box.y && coords.y <= box.y + box.h;
          });

          if (hitIdx !== -1) {
            pushUndoState(pageState.pageNum - 1, 'boxes_change', JSON.parse(JSON.stringify(pageState.boxes)));
            pageState.boxes.splice(hitIdx, 1);
            redrawOverlay(pageState);
          }
        }
      }

      // Pointer Move
      function handleMove(e) {
        if (!isDrawing && !isScrubbing) return;
        e.preventDefault();
        const coords = getCanvasCoords(e);

        if (isDrawing && currentDragBox) {
          const x = Math.min(startX, coords.x);
          const y = Math.min(startY, coords.y);
          const w = Math.abs(coords.x - startX);
          const h = Math.abs(coords.y - startY);

          currentDragBox.x = x;
          currentDragBox.y = y;
          currentDragBox.w = w;
          currentDragBox.h = h;

          redrawOverlay(pageState, null, currentDragBox);

        } else if (isScrubbing) {
          rasterCtx.beginPath();
          rasterCtx.moveTo(lastX, lastY);
          rasterCtx.lineTo(coords.x, coords.y);
          rasterCtx.strokeStyle = '#FFFFFF';
          rasterCtx.lineWidth = brushSize;
          rasterCtx.lineCap = 'round';
          rasterCtx.lineJoin = 'round';
          rasterCtx.stroke();

          lastX = coords.x;
          lastY = coords.y;
        }
      }

      // Pointer Up / End
      function handleEnd(e) {
        if (isDrawing && currentDragBox) {
          if (currentDragBox.w > 4 && currentDragBox.h > 4) {
            pushUndoState(pageState.pageNum - 1, 'boxes_change', JSON.parse(JSON.stringify(pageState.boxes)));
            pageState.boxes.push({ ...currentDragBox });
          }
          currentDragBox = null;
          isDrawing = false;
          redrawOverlay(pageState);
        }

        if (isScrubbing) {
          isScrubbing = false;
        }
      }

      overlayCanvas.addEventListener('mousedown', handleStart);
      overlayCanvas.addEventListener('mousemove', handleMove);
      overlayCanvas.addEventListener('mouseup', handleEnd);

      overlayCanvas.addEventListener('touchstart', handleStart, { passive: false });
      overlayCanvas.addEventListener('touchmove', handleMove, { passive: false });
      overlayCanvas.addEventListener('touchend', handleEnd);
    }

    // Redraw Overlay Canvas with Vector Boxes and Eraser Hover Indicators
    function redrawOverlay(pageState, hoverCoords = null, activeDragBox = null) {
      const { overlayCanvas, overlayCtx, boxes } = pageState;
      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      // Render saved boxes
      boxes.forEach(box => {
        let isHovered = false;
        if (hoverCoords && currentMode === 'eraser') {
          if (hoverCoords.x >= box.x && hoverCoords.x <= box.x + box.w &&
              hoverCoords.y >= box.y && hoverCoords.y <= box.y + box.h) {
            isHovered = true;
          }
        }

        if (box.type === 'blackout') {
          overlayCtx.fillStyle = '#000000';
          overlayCtx.fillRect(box.x, box.y, box.w, box.h);
        } else if (box.type === 'whiteout') {
          overlayCtx.fillStyle = '#FFFFFF';
          overlayCtx.fillRect(box.x, box.y, box.w, box.h);
          // Thin border for whiteout visibility on canvas
          overlayCtx.strokeStyle = '#CBD5E1';
          overlayCtx.lineWidth = 1;
          overlayCtx.strokeRect(box.x, box.y, box.w, box.h);
        }

        // Highlight hover delete box in Mask Eraser Mode
        if (isHovered) {
          overlayCtx.strokeStyle = '#EF4444';
          overlayCtx.lineWidth = 3;
          overlayCtx.strokeRect(box.x - 2, box.y - 2, box.w + 4, box.h + 4);
          overlayCtx.fillStyle = '#EF4444';
          overlayCtx.font = 'bold 14px "Plus Jakarta Sans", sans-serif';
          overlayCtx.fillText('Click to Remove', box.x + 4, box.y + 16);
        }
      });

      // Render current drag box preview
      if (activeDragBox) {
        if (activeDragBox.type === 'blackout') {
          overlayCtx.fillStyle = 'rgba(0, 0, 0, 0.75)';
          overlayCtx.fillRect(activeDragBox.x, activeDragBox.y, activeDragBox.w, activeDragBox.h);
          overlayCtx.strokeStyle = '#274737';
          overlayCtx.lineWidth = 2;
          overlayCtx.strokeRect(activeDragBox.x, activeDragBox.y, activeDragBox.w, activeDragBox.h);
        } else if (activeDragBox.type === 'whiteout') {
          overlayCtx.fillStyle = 'rgba(255, 255, 255, 0.85)';
          overlayCtx.fillRect(activeDragBox.x, activeDragBox.y, activeDragBox.w, activeDragBox.h);
          overlayCtx.strokeStyle = '#274737';
          overlayCtx.lineWidth = 2;
          overlayCtx.strokeRect(activeDragBox.x, activeDragBox.y, activeDragBox.w, activeDragBox.h);
        }
      }
    }

    // Undo / Redo History Stack Mechanics
    function pushUndoState(pageIndex, type, snapshotData) {
      undoStack.push({
        pageIndex,
        type,
        snapshotData
      });
      redoStack = []; // Clear redo stack on new action
      updateHistoryButtons();
    }

    function updateHistoryButtons() {
      undoActionBtn.disabled = undoStack.length === 0;
      redoActionBtn.disabled = redoStack.length === 0;
    }

    undoActionBtn.addEventListener('click', () => {
      if (undoStack.length === 0) return;
      const lastAction = undoStack.pop();
      const pageState = pageStates[lastAction.pageIndex];

      if (lastAction.type === 'boxes_change') {
        // Save current boxes to redo stack
        redoStack.push({
          pageIndex: lastAction.pageIndex,
          type: 'boxes_change',
          snapshotData: JSON.parse(JSON.stringify(pageState.boxes))
        });
        pageState.boxes = JSON.parse(JSON.stringify(lastAction.snapshotData));
        redrawOverlay(pageState);

      } else if (lastAction.type === 'raster_stroke') {
        // Save current raster to redo stack
        const currentRaster = pageState.rasterCtx.getImageData(0, 0, pageState.rasterCanvas.width, pageState.rasterCanvas.height);
        redoStack.push({
          pageIndex: lastAction.pageIndex,
          type: 'raster_stroke',
          snapshotData: currentRaster
        });
        pageState.rasterCtx.putImageData(lastAction.snapshotData, 0, 0);
      }

      updateHistoryButtons();
    });

    redoActionBtn.addEventListener('click', () => {
      if (redoStack.length === 0) return;
      const nextAction = redoStack.pop();
      const pageState = pageStates[nextAction.pageIndex];

      if (nextAction.type === 'boxes_change') {
        undoStack.push({
          pageIndex: nextAction.pageIndex,
          type: 'boxes_change',
          snapshotData: JSON.parse(JSON.stringify(pageState.boxes))
        });
        pageState.boxes = JSON.parse(JSON.stringify(nextAction.snapshotData));
        redrawOverlay(pageState);

      } else if (nextAction.type === 'raster_stroke') {
        const currentRaster = pageState.rasterCtx.getImageData(0, 0, pageState.rasterCanvas.width, pageState.rasterCanvas.height);
        undoStack.push({
          pageIndex: nextAction.pageIndex,
          type: 'raster_stroke',
          snapshotData: currentRaster
        });
        pageState.rasterCtx.putImageData(nextAction.snapshotData, 0, 0);
      }

      updateHistoryButtons();
    });

    // Clear All Marks
    clearAllMarksBtn.addEventListener('click', () => {
      if (!confirm('Are you sure you want to clear all drawn boxes and eraser marks from all pages?')) return;

      pageStates.forEach((pageState, idx) => {
        pushUndoState(idx, 'boxes_change', JSON.parse(JSON.stringify(pageState.boxes)));
        pageState.boxes = [];
        redrawOverlay(pageState);
      });
    });

    // Primary Action Button: Apply Changes & Compile PDF via PDF-Lib
    applyRedactionBtn.addEventListener('click', async () => {
      if (!selectedFile || pageStates.length === 0) return;

      // Switch to Processing State
      workbenchPanel.classList.add('hidden');
      processingProgressBox.classList.remove('hidden');

      progressStatusText.textContent = 'Compositing raster layers and wiping underlying data...';
      progressBarFill.style.width = '20%';
      progressPercentText.textContent = '20%';

      setTimeout(async () => {
        try {
          // Create a fresh new PDFDocument to embed flattened, sanitized pages
          const pdfLibDoc = await PDFLib.PDFDocument.create();

          const totalPages = pageStates.length;

          for (let i = 0; i < totalPages; i++) {
            const pageState = pageStates[i];
            const pct = Math.round(20 + ((i + 1) / totalPages) * 65);
            progressBarFill.style.width = `${pct}%`;
            progressPercentText.textContent = `${pct}%`;
            progressStatusText.textContent = `Sanitizing page ${i + 1} of ${totalPages}...`;

            // Offscreen canvas to composite raster + overlay boxes
            const offscreen = document.createElement('canvas');
            offscreen.width = pageState.width;
            offscreen.height = pageState.height;
            const ctx = offscreen.getContext('2d');

            // Fill base paper white
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, offscreen.width, offscreen.height);

            // Draw Layer 1 (Raster page with freehand scrubber wiping)
            ctx.drawImage(pageState.rasterCanvas, 0, 0);

            // Draw Layer 2 (Boxes)
            pageState.boxes.forEach(box => {
              if (box.type === 'blackout') {
                ctx.fillStyle = '#000000';
                ctx.fillRect(box.x, box.y, box.w, box.h);
              } else if (box.type === 'whiteout') {
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(box.x, box.y, box.w, box.h);
              }
            });

            // Convert composited canvas to high-quality JPEG
            const jpgDataUrl = offscreen.toDataURL('image/jpeg', 0.92);
            const jpgBytes = await fetch(jpgDataUrl).then(res => res.arrayBuffer());

            // Embed flattened image into PDF
            const embeddedJpg = await pdfLibDoc.embedJpg(jpgBytes);

            // Add page with original dimensions in PDF points (72 DPI)
            const pdfWidth = pageState.width / RENDER_SCALE;
            const pdfHeight = pageState.height / RENDER_SCALE;

            const pdfPage = pdfLibDoc.addPage([pdfWidth, pdfHeight]);
            pdfPage.drawImage(embeddedJpg, {
              x: 0,
              y: 0,
              width: pdfWidth,
              height: pdfHeight
            });
          }

          progressBarFill.style.width = '95%';
          progressPercentText.textContent = '95%';
          progressStatusText.textContent = 'Finalizing uncopyable PDF serialization...';

          const sanitizedBytes = await pdfLibDoc.save();

          progressBarFill.style.width = '100%';
          progressPercentText.textContent = '100%';

          // Create Blob URL
          const blob = new Blob([sanitizedBytes], { type: 'application/pdf' });
          if (redactedPdfBlobUrl) URL.revokeObjectURL(redactedPdfBlobUrl);
          redactedPdfBlobUrl = URL.createObjectURL(blob);

          const sizeMB = (blob.size / (1024 * 1024)).toFixed(2);
          const exportName = outputFilenameInput.value.trim() || 'SlowPDF_Redacted_Document';

          successFileNameDisplay.textContent = exportName.endsWith('.pdf') ? exportName : `${exportName}.pdf`;
          successFileStatsDisplay.textContent = `${sizeMB} MB • ${totalPages} Page${totalPages > 1 ? 's' : ''} • Flattened & Uncopyable`;

          // Show Success Screen
          processingProgressBox.classList.add('hidden');
          successPanel.classList.remove('hidden');

          window.scrollTo({ top: 100, behavior: 'smooth' });

        } catch (err) {
          console.error('Error redacting PDF:', err);
          alert('Failed to redact PDF: ' + err.message);
          processingProgressBox.classList.add('hidden');
          workbenchPanel.classList.remove('hidden');
        }
      }, 100);
    });

    // Trigger Download
    downloadRedactedPdfBtn.addEventListener('click', () => {
      if (!redactedPdfBlobUrl) return;
      const exportName = outputFilenameInput.value.trim() || 'SlowPDF_Redacted_Document';
      const filename = exportName.endsWith('.pdf') ? exportName : `${exportName}.pdf`;

      const link = document.createElement('a');
      link.href = redactedPdfBlobUrl;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // Reset Workflow to Redact Another PDF
    redactAnotherBtn.addEventListener('click', () => {
      selectedFile = null;
      fileArrayBuffer = null;
      pdfDocObj = null;
      if (redactedPdfBlobUrl) URL.revokeObjectURL(redactedPdfBlobUrl);
      redactedPdfBlobUrl = null;

      fileInput.value = '';
      continuousViewerContainer.innerHTML = '';
      pageStates = [];
      undoStack = [];
      redoStack = [];

      successPanel.classList.add('hidden');
      workbenchPanel.classList.add('hidden');
      emptyDropzone.classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // FAQ Accordion Mechanics
    const faqTriggers = document.querySelectorAll('.faq-trigger');
    faqTriggers.forEach(trigger => {
      trigger.addEventListener('click', () => {
        const item = trigger.closest('.faq-item');
        const content = item.querySelector('.faq-content');
        const icon = trigger.querySelector('.faq-icon');

        const isExpanded = content.style.display === 'block';

        if (isExpanded) {
          content.style.display = 'none';
          icon.style.transform = 'rotate(0deg)';
        } else {
          content.style.display = 'block';
          icon.style.transform = 'rotate(180deg)';
        }
      });
    });

    // FAQ "View All 10 Questions" Button
    const toggleAllFaqBtn = document.getElementById('toggle-all-faq-btn');
    const extraFaqItems = document.getElementById('extra-faq-items');

    if (toggleAllFaqBtn && extraFaqItems) {
      toggleAllFaqBtn.addEventListener('click', () => {
        if (extraFaqItems.classList.contains('hidden')) {
          extraFaqItems.classList.remove('hidden');
          toggleAllFaqBtn.textContent = 'Hide Extra Questions';
        } else {
          extraFaqItems.classList.add('hidden');
          toggleAllFaqBtn.textContent = 'View All 10 Questions';
        }
      });
    }

    // Auto-initialize Carousel and Banners if available
    window.addEventListener('DOMContentLoaded', () => {
      if (window.initializeBanners) {
        window.initializeBanners('whiteout-pdf');
      }
      if (window.initializeCarousel) {
        window.initializeCarousel();
      }
    });
  </script>
</body>
</html>
