  <!-- ========================================== -->
  <!-- 7. SIGN & STAMP ENGINE SCRIPT               -->
  <!-- ========================================== -->
  <script>
    // Global State
    let selectedFile = null;
    let fileArrayBuffer = null;
    let pdfDocObj = null;
    let signedPdfBlobUrl = null;

    const RENDER_SCALE = 1.3;
    let pageCount = 0;

    // Active Stamp Data URL to be placed
    let activeStampDataUrl = null;
    let uploadedStampDataUrl = null;

    // Array of placed stamp objects
    // Each object: { id, pageIdx, x, y, width, height, dataUrl }
    let placedStamps = [];

    // Drawing Canvas State
    let penColor = '#000000';
    let penThickness = 2.5;
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;

    // DOM Elements
    const fileInput = document.getElementById('pdf-file-input');
    const stampImageInput = document.getElementById('stamp-image-input');
    const emptyDropzone = document.getElementById('empty-dropzone');
    const workbenchPanel = document.getElementById('workbench-panel');
    const processingProgressBox = document.getElementById('processing-progress-box');
    const successPanel = document.getElementById('success-panel');

    const fileNameDisplay = document.getElementById('file-name-display');
    const fileMetaDisplay = document.getElementById('file-meta-display');
    const continuousViewerContainer = document.getElementById('continuous-viewer-container');

    // Tabs
    const tabDrawBtn = document.getElementById('tab-draw-btn');
    const tabTypeBtn = document.getElementById('tab-type-btn');
    const tabUploadBtn = document.getElementById('tab-upload-btn');

    const tabContentDraw = document.getElementById('tab-content-draw');
    const tabContentType = document.getElementById('tab-content-type');
    const tabContentUpload = document.getElementById('tab-content-upload');

    // Drawing Canvas
    const drawCanvas = document.getElementById('signature-draw-canvas');
    const penThicknessSlider = document.getElementById('pen-thickness-slider');
    const clearDrawCanvasBtn = document.getElementById('clear-draw-canvas-btn');
    const addDrawnSigBtn = document.getElementById('add-drawn-signature-btn');

    // Typed Signature
    const typedNameInput = document.getElementById('typed-name-input');
    const typedFontSelect = document.getElementById('typed-font-select');
    const typedSigPreview = document.getElementById('typed-signature-preview');
    const addTypedSigBtn = document.getElementById('add-typed-signature-btn');

    // Uploaded Stamp
    const stampPreviewContainer = document.getElementById('stamp-preview-container');
    const stampPreviewImg = document.getElementById('stamp-preview-img');
    const addUploadedStampBtn = document.getElementById('add-uploaded-stamp-btn');

    // Palette
    const activePaletteContainer = document.getElementById('active-palette-container');
    const activeStampThumbnail = document.getElementById('active-stamp-thumbnail');

    const outputFilenameInput = document.getElementById('output-filename-input');
    const applySignatureBtn = document.getElementById('apply-signature-btn');

    const progressBarFill = document.getElementById('progress-bar-fill');
    const progressStatusText = document.getElementById('progress-status-text');
    const progressPercentText = document.getElementById('progress-percent-text');

    const successFileNameDisplay = document.getElementById('success-file-name-display');
    const successFileStatsDisplay = document.getElementById('success-file-stats-display');
    const downloadSignedPdfBtn = document.getElementById('download-signed-pdf-btn');
    const signAnotherBtn = document.getElementById('sign-another-btn');

    // Setup Tabs
    const tabs = [
      { btn: tabDrawBtn, content: tabContentDraw },
      { btn: tabTypeBtn, content: tabContentType },
      { btn: tabUploadBtn, content: tabContentUpload }
    ];

    tabs.forEach(t => {
      t.btn?.addEventListener('click', () => {
        tabs.forEach(item => {
          item.btn.classList.remove('active');
          item.content.classList.add('hidden');
        });
        t.btn.classList.add('active');
        t.content.classList.remove('hidden');

        if (t.btn === tabDrawBtn) {
          resizeDrawCanvas();
        }
      });
    });

    // Drawing Canvas Initialization
    const drawCtx = drawCanvas.getContext('2d');

    function resizeDrawCanvas() {
      const rect = drawCanvas.getBoundingClientRect();
      drawCanvas.width = rect.width;
      drawCanvas.height = rect.height;
    }

    window.addEventListener('resize', resizeDrawCanvas);

    // Color Pills
    const colorPills = document.querySelectorAll('.color-pill');
    colorPills.forEach(pill => {
      pill?.addEventListener('click', () => {
        colorPills.forEach(p => p.classList.remove('ring-2', 'ring-black', 'ring-blue-600', 'ring-red-600'));
        penColor = pill.getAttribute('data-color');
        pill.classList.add('ring-2', 'ring-offset-1', 'ring-stone-800');
      });
    });

    penThicknessSlider?.addEventListener('input', (e) => {
      penThickness = parseFloat(e.target.value);
    });

    clearDrawCanvasBtn?.addEventListener('click', () => {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    });

    // Pointer Events for Draw Canvas
    function getDrawCanvasCoords(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    drawCanvas?.addEventListener('mousedown', (e) => {
      isDrawing = true;
      const pos = getDrawCanvasCoords(e);
      lastX = pos.x;
      lastY = pos.y;
    });

    drawCanvas?.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const pos = getDrawCanvasCoords(e);
      drawCtx.beginPath();
      drawCtx.moveTo(lastX, lastY);
      drawCtx.lineTo(pos.x, pos.y);
      drawCtx.strokeStyle = penColor;
      drawCtx.lineWidth = penThickness;
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      drawCtx.stroke();
      lastX = pos.x;
      lastY = pos.y;
    });

    document.addEventListener('mouseup', () => { isDrawing = false; });

    drawCanvas?.addEventListener('touchstart', (e) => {
      e.preventDefault();
      isDrawing = true;
      const pos = getDrawCanvasCoords(e);
      lastX = pos.x;
      lastY = pos.y;
    }, { passive: false });

    drawCanvas?.addEventListener('touchmove', (e) => {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getDrawCanvasCoords(e);
      drawCtx.beginPath();
      drawCtx.moveTo(lastX, lastY);
      drawCtx.lineTo(pos.x, pos.y);
      drawCtx.strokeStyle = penColor;
      drawCtx.lineWidth = penThickness;
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      drawCtx.stroke();
      lastX = pos.x;
      lastY = pos.y;
    }, { passive: false });

    drawCanvas?.addEventListener('touchend', () => { isDrawing = false; });

    // Use Drawn Signature Button
    addDrawnSigBtn?.addEventListener('click', () => {
      // Export draw canvas as PNG
      const dataUrl = drawCanvas.toDataURL('image/png');
      setActiveStamp(dataUrl);
    });

    // Typed Signature Preview & Handler
    function updateTypedPreview() {
      const name = typedNameInput.value.trim() || 'Signature';
      const font = typedFontSelect.value;
      typedSigPreview.textContent = name;
      
      if (font === 'Dancing Script') {
        typedSigPreview.className = 'text-3xl text-black font-dancing';
      } else if (font === 'Caveat') {
        typedSigPreview.className = 'text-3xl text-black font-caveat';
      } else if (font === 'Great Vibes') {
        typedSigPreview.className = 'text-3xl text-black font-vibes';
      }
    }

    typedNameInput?.addEventListener('input', updateTypedPreview);
    typedFontSelect?.addEventListener('change', updateTypedPreview);

    addTypedSigBtn?.addEventListener('click', () => {
      // Render typed text to offscreen canvas
      const offscreen = document.createElement('canvas');
      offscreen.width = 400;
      offscreen.height = 120;
      const ctx = offscreen.getContext('2d');

      const font = typedFontSelect.value;
      const name = typedNameInput.value.trim() || 'Signature';

      ctx.font = `42px "${font}", cursive`;
      ctx.fillStyle = '#000000';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(name, 200, 60);

      const dataUrl = offscreen.toDataURL('image/png');
      setActiveStamp(dataUrl);
    });

    // Uploaded Stamp Handler
    stampImageInput?.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          uploadedStampDataUrl = evt.target.result;
          stampPreviewImg.src = uploadedStampDataUrl;
          stampPreviewContainer.classList.remove('hidden');
          addUploadedStampBtn.disabled = false;
        };
        reader.readAsDataURL(e.target.files[0]);
      }
    });

    addUploadedStampBtn?.addEventListener('click', () => {
      if (uploadedStampDataUrl) {
        setActiveStamp(uploadedStampDataUrl);
      }
    });

    // Set Active Stamp
    function setActiveStamp(dataUrl) {
      activeStampDataUrl = dataUrl;
      activeStampThumbnail.innerHTML = `<img src="${dataUrl}" class="h-10 object-contain" />`;
      activePaletteContainer.classList.remove('hidden');
    }

    // PDF Selection Handler
    fileInput?.addEventListener('change', handleFileSelection);

    ['dragover', 'dragenter'].forEach(eventName => {
      emptyDropzone?.addEventListener(eventName, (e) => {
        e.preventDefault();
        emptyDropzone.classList.add('dragover-active');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      emptyDropzone?.addEventListener(eventName, (e) => {
        e.preventDefault();
        emptyDropzone.classList.remove('dragover-active');
      });
    });

    emptyDropzone?.addEventListener('drop', (e) => {
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        fileInput.files = e.dataTransfer.files;
        handleFileSelection();
      }
    });

    async function handleFileSelection() {
      if (!fileInput.files || fileInput.files.length === 0) return;

      selectedFile = fileInput.files[0];
      if (selectedFile.type !== 'application/pdf' && !selectedFile.name.toLowerCase().endsWith('.pdf')) {
        alert('Please select a valid PDF file.');
        return;
      }

      const sizeMB = (selectedFile.size / (1024 * 1024)).toFixed(2);
      fileNameDisplay.textContent = selectedFile.name;
      fileMetaDisplay.textContent = `${sizeMB} MB • Reading document pages...`;

      const baseName = selectedFile.name.replace(/\.pdf$/i, '');
      outputFilenameInput.value = `SlowPDF_Signed_${baseName}`;

      emptyDropzone.classList.add('hidden');
      workbenchPanel.classList.remove('hidden');

      try {
        fileArrayBuffer = await selectedFile.arrayBuffer();

        const loadingTask = pdfjsLib.getDocument({ data: fileArrayBuffer.slice(0) });
        pdfDocObj = await loadingTask.promise;

        pageCount = pdfDocObj.numPages;
        fileMetaDisplay.textContent = `${sizeMB} MB • ${pageCount} Page${pageCount > 1 ? 's' : ''} • Ready for Signing`;

        continuousViewerContainer.innerHTML = '';
        placedStamps = [];

        // Auto create default typed signature
        updateTypedPreview();
        addTypedSigBtn.click();

        for (let i = 1; i <= pageCount; i++) {
          await renderPageCard(i);
        }

      } catch (err) {
        console.error('Error opening PDF:', err);
        alert('Failed to load PDF file: ' + err.message);
        workbenchPanel.classList.add('hidden');
        emptyDropzone.classList.remove('hidden');
      }
    }

    // Render Page Card with Click-to-Stamp Support
    async function renderPageCard(pageNum) {
      const page = await pdfDocObj.getPage(pageNum);
      const dpr = window.devicePixelRatio || 1;
      const targetScale = 2.0;
      const baseViewport = page.getViewport({ scale: 1.2 });
      const viewport = page.getViewport({ scale: 1.2 * targetScale * dpr });

      const card = document.createElement('div');
      card.className = 'w-full max-w-3xl flex flex-col items-center space-y-2';

      const pagePill = document.createElement('div');
      pagePill.className = 'px-3 py-1 rounded-full bg-stone-200/80 dark:bg-stone-800 text-stone-700 dark:text-stone-300 text-xs font-bold shadow-2xs';
      pagePill.textContent = `Page ${pageNum} of ${pageCount}`;

      const wrapper = document.createElement('div');
      wrapper.className = 'page-sign-wrapper max-w-full';
      wrapper.style.width = `${Math.floor(baseViewport.width)}px`;
      wrapper.style.height = `${Math.floor(baseViewport.height)}px`;
      wrapper.setAttribute('data-page-index', pageNum - 1);

      const canvas = document.createElement('canvas');
      canvas.className = 'block w-full h-auto rounded shadow-md';
      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      canvas.style.width = `${Math.floor(baseViewport.width)}px`;
      canvas.style.height = `${Math.floor(baseViewport.height)}px`;
      canvas.style.imageRendering = '-webkit-optimize-contrast';
      canvas.style.imageRendering = 'crisp-edges';
      canvas.style.display = 'block';
      canvas.style.margin = '0 auto';
      canvas.style.boxShadow = '0 4px 14px rgba(0, 0, 0, 0.08)';

      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport: viewport }).promise;

      wrapper.appendChild(canvas);
      card.appendChild(pagePill);
      card.appendChild(wrapper);

      continuousViewerContainer.appendChild(card);

      // Click to Place Active Stamp
      wrapper?.addEventListener('click', (e) => {
        if (!activeStampDataUrl) return;
        if (e.target.closest('.placed-stamp-box')) return; // Ignore click on existing stamp

        const rect = wrapper.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;

        placeStampOnPage(pageNum - 1, wrapper, clickX - 80, clickY - 30, 160, 60, activeStampDataUrl);
      });
    }

    // Place Stamp Box Element on Page Wrapper
    function placeStampOnPage(pageIdx, wrapper, x, y, w, h, dataUrl) {
      const stampId = Date.now() + Math.random();

      const stampBox = document.createElement('div');
      stampBox.className = 'placed-stamp-box';
      stampBox.style.left = `${Math.max(0, x)}px`;
      stampBox.style.top = `${Math.max(0, y)}px`;
      stampBox.style.width = `${w}px`;
      stampBox.style.height = `${h}px`;

      const img = document.createElement('img');
      img.src = dataUrl;
      img.className = 'placed-stamp-img';

      const deleteBtn = document.createElement('div');
      deleteBtn.className = 'stamp-handle-delete';
      deleteBtn.textContent = '✕';
      deleteBtn.title = 'Delete Signature';
      deleteBtn?.addEventListener('click', (e) => {
        e.stopPropagation();
        wrapper.removeChild(stampBox);
        placedStamps = placedStamps.filter(s => s.id !== stampId);
      });

      const resizeHandle = document.createElement('div');
      resizeHandle.className = 'stamp-handle-resize';

      stampBox.appendChild(img);
      stampBox.appendChild(deleteBtn);
      stampBox.appendChild(resizeHandle);
      wrapper.appendChild(stampBox);

      const stampObj = {
        id: stampId,
        pageIdx,
        x,
        y,
        width: w,
        height: h,
        dataUrl,
        element: stampBox
      };

      placedStamps.push(stampObj);

      // Interactive Dragging & Resizing Mechanics for Stamp Box
      let isDragging = false;
      let isResizing = false;
      let startX = 0, startY = 0;
      let startLeft = 0, startTop = 0;
      let startW = 0, startH = 0;

      function getPos(e) {
        const touch = e.touches ? e.touches[0] : e;
        return { x: touch.clientX, y: touch.clientY };
      }

      stampBox?.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        if (e.target === deleteBtn) return;
        const pos = getPos(e);
        startX = pos.x;
        startY = pos.y;

        if (e.target === resizeHandle) {
          isResizing = true;
          startW = stampObj.width;
          startH = stampObj.height;
        } else {
          isDragging = true;
          startLeft = stampObj.x;
          startTop = stampObj.y;
        }

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
      });

      stampBox?.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        if (e.target === deleteBtn) return;
        const pos = getPos(e);
        startX = pos.x;
        startY = pos.y;

        if (e.target === resizeHandle) {
          isResizing = true;
          startW = stampObj.width;
          startH = stampObj.height;
        } else {
          isDragging = true;
          startLeft = stampObj.x;
          startTop = stampObj.y;
        }

        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd);
      });

      function onMove(e) {
        if (!isDragging && !isResizing) return;
        e.preventDefault();
        const pos = getPos(e);
        const dx = pos.x - startX;
        const dy = pos.y - startY;

        const wrapperW = wrapper.clientWidth;
        const wrapperH = wrapper.clientHeight;

        if (isDragging) {
          const newX = Math.max(0, Math.min(wrapperW - stampObj.width, startLeft + dx));
          const newY = Math.max(0, Math.min(wrapperH - stampObj.height, startTop + dy));
          stampObj.x = newX;
          stampObj.y = newY;
          stampBox.style.left = `${newX}px`;
          stampBox.style.top = `${newY}px`;
        } else if (isResizing) {
          const newW = Math.max(40, Math.min(wrapperW - stampObj.x, startW + dx));
          const newH = Math.max(20, Math.min(wrapperH - stampObj.y, startH + dy));
          stampObj.width = newW;
          stampObj.height = newH;
          stampBox.style.width = `${newW}px`;
          stampBox.style.height = `${newH}px`;
        }
      }

      function onEnd() {
        isDragging = false;
        isResizing = false;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onEnd);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onEnd);
      }
    }

    // Primary Action Button: Embed Signatures & Export PDF
    applySignatureBtn?.addEventListener('click', async () => {
      if (!selectedFile || !fileArrayBuffer) return;

      if (placedStamps.length === 0) {
        alert('Please place at least one signature or stamp on the document before exporting.');
        return;
      }

      workbenchPanel.classList.add('hidden');
      processingProgressBox.classList.remove('hidden');

      progressStatusText.textContent = 'Embedding digital signature PNG layers into PDF streams...';
      progressBarFill.style.width = '25%';
      progressPercentText.textContent = '25%';

      setTimeout(async () => {
        try {
          const pdfLibDoc = await PDFLib.PDFDocument.load(fileArrayBuffer.slice(0));
          const pages = pdfLibDoc.getPages();

          progressBarFill.style.width = '50%';
          progressPercentText.textContent = '50%';

          for (let i = 0; i < placedStamps.length; i++) {
            const stamp = placedStamps[i];
            const page = pages[stamp.pageIdx];
            const { width: pdfWidth, height: pdfHeight } = page.getSize();

            const wrapperEl = document.querySelector(`[data-page-index="${stamp.pageIdx}"]`);
            const screenW = wrapperEl.clientWidth;
            const screenH = wrapperEl.clientHeight;

            // Convert screen coordinates to PDF point coordinates (taking Y-axis inversion into account)
            const scaleX = pdfWidth / screenW;
            const scaleY = pdfHeight / screenH;

            const pdfX = stamp.x * scaleX;
            const pdfY = (screenH - (stamp.y + stamp.height)) * scaleY;
            const pdfW = stamp.width * scaleX;
            const pdfH = stamp.height * scaleY;

            // Embed PNG bytes
            const pngBytes = await fetch(stamp.dataUrl).then(res => res.arrayBuffer());
            const embeddedImage = await pdfLibDoc.embedPng(pngBytes);

            page.drawImage(embeddedImage, {
              x: pdfX,
              y: pdfY,
              width: pdfW,
              height: pdfH
            });
          }

          progressBarFill.style.width = '90%';
          progressPercentText.textContent = '90%';
          progressStatusText.textContent = 'Serializing signed PDF file...';

          const signedBytes = await pdfLibDoc.save();

          progressBarFill.style.width = '100%';
          progressPercentText.textContent = '100%';

          const blob = new Blob([signedBytes], { type: 'application/pdf' });
          if (signedPdfBlobUrl) URL.revokeObjectURL(signedPdfBlobUrl);
          signedPdfBlobUrl = URL.createObjectURL(blob);

          const sizeMB = (blob.size / (1024 * 1024)).toFixed(2);
          const exportName = outputFilenameInput.value.trim() || 'SlowPDF_Signed_Document';

          successFileNameDisplay.textContent = exportName.endsWith('.pdf') ? exportName : `${exportName}.pdf`;
          successFileStatsDisplay.textContent = `${sizeMB} MB • ${placedStamps.length} Signature${placedStamps.length > 1 ? 's' : ''} Embedded • 100% Legal Quality`;

          // Show Success Screen
          processingProgressBox.classList.add('hidden');
          successPanel.classList.remove('hidden');

          window.scrollTo({ top: 100, behavior: 'smooth' });

        } catch (err) {
          console.error('Error signing PDF:', err);
          alert('Failed to sign PDF: ' + err.message);
          processingProgressBox.classList.add('hidden');
          workbenchPanel.classList.remove('hidden');
        }
      }, 100);
    });

    // Download Signed PDF
    downloadSignedPdfBtn?.addEventListener('click', () => {
      if (!signedPdfBlobUrl) return;
      const exportName = outputFilenameInput.value.trim() || 'SlowPDF_Signed_Document';
      const filename = exportName.endsWith('.pdf') ? exportName : `${exportName}.pdf`;

      const link = document.createElement('a');
      link.href = signedPdfBlobUrl;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // Reset Workflow to Sign Another PDF
    signAnotherBtn?.addEventListener('click', () => {
      selectedFile = null;
      fileArrayBuffer = null;
      pdfDocObj = null;
      if (signedPdfBlobUrl) URL.revokeObjectURL(signedPdfBlobUrl);
      signedPdfBlobUrl = null;

      fileInput.value = '';
      placedStamps = [];
      continuousViewerContainer.innerHTML = '';

      successPanel.classList.add('hidden');
      workbenchPanel.classList.add('hidden');
      emptyDropzone.classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // FAQ Accordion Mechanics
    const faqTriggers = document.querySelectorAll('.faq-trigger');
    faqTriggers.forEach(trigger => {
      trigger?.addEventListener('click', () => {
        const item = trigger.closest('.faq-item');
        const content = item.querySelector('.faq-content');
        const icon = trigger.querySelector('.faq-icon');

        const isExpanded = content.style.display === 'block';

        if (isExpanded) {
          content.style.display = 'none';
          icon.style.transform = 'rotate(0deg)';
        } else {
          content.style.display = 'block';
          icon.style.transform = 'rotate(180deg)';
        }
      });
    });

    // FAQ "View All 10 Questions" Button
    const toggleAllFaqBtn = document.getElementById('toggle-all-faq-btn');
    const extraFaqItems = document.getElementById('extra-faq-items');

    if (toggleAllFaqBtn && extraFaqItems) {
      toggleAllFaqBtn?.addEventListener('click', () => {
        if (extraFaqItems.classList.contains('hidden')) {
          extraFaqItems.classList.remove('hidden');
          toggleAllFaqBtn.textContent = 'Hide Extra Questions';
        } else {
          extraFaqItems.classList.add('hidden');
          toggleAllFaqBtn.textContent = 'View All 10 Questions';
        }
      });
    }

    // Auto-initialize Carousel and Banners if available
    window.addEventListener('DOMContentLoaded', () => {
      if (window.initializeBanners) {
        window.initializeBanners('sign-pdf');
      }
      if (window.initializeCarousel) {
        window.initializeCarousel();
      }
    });
  </script>
</body>
</html>
