  <!-- ========================================== -->
  <!-- JAVASCRIPT CONVERSION ENGINE               -->
  <!-- ========================================== -->
  <script>
    // 1. Configure PDF.js Worker
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // 2. Dark Mode Switcher
    const darkModeToggle = document.getElementById('dark-mode-toggle');
    const darkModeThumb = document.getElementById('dark-mode-thumb');

    function applyTheme(isDark) {
      if (isDark) {
        document.documentElement.classList.add('dark');
        if (darkModeToggle) {
          darkModeToggle.setAttribute('aria-checked', 'true');
          darkModeToggle.classList.remove('bg-stone-300');
          darkModeToggle.classList.add('bg-[#355E4B]');
        }
        if (darkModeThumb) {
          darkModeThumb.classList.remove('translate-x-0');
          darkModeThumb.classList.add('translate-x-5');
        }
      } else {
        document.documentElement.classList.remove('dark');
        if (darkModeToggle) {
          darkModeToggle.setAttribute('aria-checked', 'false');
          darkModeToggle.classList.remove('bg-[#355E4B]');
          darkModeToggle.classList.add('bg-stone-300');
        }
        if (darkModeThumb) {
          darkModeThumb.classList.remove('translate-x-5');
          darkModeThumb.classList.add('translate-x-0');
        }
      }
    }

    const savedTheme = localStorage.getItem('slowpdf_theme');
    const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(savedTheme ? savedTheme === 'dark' : systemPrefersDark);

    if (darkModeToggle) {
      darkModeToggle.addEventListener('click', () => {
        const isDark = document.documentElement.classList.contains('dark');
        applyTheme(!isDark);
        localStorage.setItem('slowpdf_theme', !isDark ? 'dark' : 'light');
      });
    }

    // 3. Hamburger Menu
    const hamburgerBtn = document.getElementById('hamburger-btn');
    const menuModal = document.getElementById('menu-modal');
    const modalCard = document.getElementById('modal-card');
    const closeModalBtn = document.getElementById('close-modal-btn');
    let menuOpen = false;

    function openMenu() {
      menuOpen = true;
      menuModal.classList.remove('hidden');
      requestAnimationFrame(() => {
        menuModal.classList.remove('opacity-0');
        modalCard.classList.remove('scale-95');
        modalCard.classList.add('scale-100');
      });
    }
    function closeMenu() {
      menuOpen = false;
      menuModal.classList.add('opacity-0');
      modalCard.classList.remove('scale-100');
      modalCard.classList.add('scale-95');
      setTimeout(() => { if (!menuOpen) menuModal.classList.add('hidden'); }, 300);
    }
    // (Navigation and modal drawer handled universally by nav-memory.js);

    // 4. PDF to Word Conversion Engine
    let currentPdfBuffer = null;
    let currentPdfName = '';
    let pdfPageCount = 0;

    const emptyDropzone = document.getElementById('empty-dropzone');
    const activeWorkbench = document.getElementById('active-workbench');
    const successPanel = document.getElementById('success-panel');
    const fileInput = document.getElementById('pdf-file-input');
    const browseBtn = document.getElementById('browse-btn');
    const changeFileBtn = document.getElementById('change-file-btn');
    const fileTitleDisplay = document.getElementById('file-title-display');
    const fileMetaDisplay = document.getElementById('file-meta-display');
    const outputFilenameInput = document.getElementById('output-filename');
    const convertActionBtn = document.getElementById('convert-action-btn');
    const convertBtnText = document.getElementById('convert-btn-text');
    const downloadWordBtn = document.getElementById('download-word-btn');
    const resetWorkbenchBtn = document.getElementById('reset-workbench-btn');
    const successDescription = document.getElementById('success-description');

    emptyDropzone.addEventListener('click', () => fileInput.click());
    if (browseBtn) browseBtn.addEventListener('click', (e) => { e.stopPropagation(); fileInput.click(); });
    if (changeFileBtn) changeFileBtn.addEventListener('click', () => fileInput.click());

    ['dragenter', 'dragover'].forEach(evt => {
      emptyDropzone.addEventListener(evt, (e) => {
        e.preventDefault(); e.stopPropagation();
        emptyDropzone.classList.add('dragover-active');
      });
    });
    ['dragleave', 'drop'].forEach(evt => {
      emptyDropzone.addEventListener(evt, (e) => {
        e.preventDefault(); e.stopPropagation();
        emptyDropzone.classList.remove('dragover-active');
      });
    });
    emptyDropzone.addEventListener('drop', (e) => {
      const files = Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
      if (files.length > 0) processSelectedFile(files[0]);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) processSelectedFile(e.target.files[0]);
    });

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024, sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    async function processSelectedFile(file) {
      currentPdfName = file.name;
      const cleanBaseName = file.name.replace(/\.pdf$/i, '').trim();
      outputFilenameInput.value = `SlowPDF_Word_${cleanBaseName}`;

      try {
        currentPdfBuffer = await file.arrayBuffer();
        const loadingTask = pdfjsLib.getDocument({ data: currentPdfBuffer.slice(0) });
        const pdfDoc = await loadingTask.promise;
        pdfPageCount = pdfDoc.numPages;

        fileTitleDisplay.textContent = file.name;
        fileMetaDisplay.textContent = `Size: ${formatBytes(file.size)} • Total Pages: ${pdfPageCount}`;

        emptyDropzone.classList.add('hidden');
        activeWorkbench.classList.remove('hidden');
        successPanel.classList.add('hidden');

      } catch (err) {
        console.error('Error reading PDF file:', err);
        alert('Could not parse PDF document. Please make sure it is a valid PDF file.');
      }
    }

    // DOCX Synthesis Algorithm
    convertActionBtn.addEventListener('click', async () => {
      if (!currentPdfBuffer) return;

      convertActionBtn.disabled = true;
      convertBtnText.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Reconstructing Word Document...
      `;

      try {
        const docxLib = window.docx || window.Docx;
        if (!docxLib) {
          alert('The Word document conversion library is still loading. Please wait a moment or refresh the page and try again.');
          return;
        }

        const detectHeadings = document.getElementById('opt-detect-headings')?.checked ?? true;
        const addPageBreaks = document.getElementById('opt-page-breaks')?.checked ?? true;

        const loadingTask = pdfjsLib.getDocument({ data: currentPdfBuffer.slice(0) });
        const pdfDoc = await loadingTask.promise;
        
        const docxChildren = [];

        for (let pIndex = 1; pIndex <= pdfDoc.numPages; pIndex++) {
          const page = await pdfDoc.getPage(pIndex);
          const textContent = await page.getTextContent();
          const items = textContent.items.filter(it => it.str && it.str.trim().length > 0);

          if (items.length > 0) {
            // Group text items by Y coordinates into lines
            items.sort((a, b) => b.transform[5] - a.transform[5]);

            const lineClusters = [];
            const Y_TOLERANCE = 4.0;

            items.forEach(it => {
              const y = it.transform[5];
              const x = it.transform[4];
              const text = it.str;
              const fontSize = Math.abs(it.transform[0]) || Math.abs(it.transform[3]) || 12;

              let found = false;
              for (const cluster of lineClusters) {
                if (Math.abs(cluster.y - y) <= Y_TOLERANCE) {
                  cluster.items.push({ x, text, fontSize });
                  found = true;
                  break;
                }
              }
              if (!found) {
                lineClusters.push({ y, fontSize, items: [{ x, text, fontSize }] });
              }
            });

            // Sort each line horizontally
            lineClusters.forEach(cluster => cluster.items.sort((a, b) => a.x - b.x));
            // Sort lines top to bottom
            lineClusters.sort((a, b) => b.y - a.y);

            // Group lines into paragraphs
            let currentParaRuns = [];
            let lastY = null;
            let lastFontSize = null;

            lineClusters.forEach(line => {
              const lineText = line.items.map(i => i.text).join(' ').trim();
              const lineFontSize = line.fontSize;

              if (lineText.length === 0) return;

              const isHeading = detectHeadings && lineFontSize > 15;
              const isSubHeading = detectHeadings && lineFontSize > 13 && lineFontSize <= 15;

              if (isHeading || isSubHeading) {
                // Flush existing paragraph
                if (currentParaRuns.length > 0) {
                  docxChildren.push(new docxLib.Paragraph({
                    children: [new docxLib.TextRun({ text: currentParaRuns.join(' '), font: 'Plus Jakarta Sans', size: 24 })],
                    spacing: { after: 200, line: 276 }
                  }));
                  currentParaRuns = [];
                }

                // Add heading paragraph
                docxChildren.push(new docxLib.Paragraph({
                  text: lineText,
                  heading: isHeading ? docxLib.HeadingLevel.HEADING_1 : docxLib.HeadingLevel.HEADING_2,
                  spacing: { before: 240, after: 120 }
                }));
              } else {
                // Check if new paragraph break based on Y gap
                if (lastY !== null && Math.abs(lastY - line.y) > lineFontSize * 2.2) {
                  if (currentParaRuns.length > 0) {
                    docxChildren.push(new docxLib.Paragraph({
                      children: [new docxLib.TextRun({ text: currentParaRuns.join(' '), font: 'Plus Jakarta Sans', size: 23 })],
                      spacing: { after: 180, line: 276 }
                    }));
                    currentParaRuns = [];
                  }
                }
                currentParaRuns.push(lineText);
              }

              lastY = line.y;
              lastFontSize = lineFontSize;
            });

            if (currentParaRuns.length > 0) {
              docxChildren.push(new docxLib.Paragraph({
                children: [new docxLib.TextRun({ text: currentParaRuns.join(' '), font: 'Plus Jakarta Sans', size: 23 })],
                spacing: { after: 200, line: 276 }
              }));
            }
          }

          // Add page break if requested
          if (addPageBreaks && pIndex < pdfDoc.numPages) {
            docxChildren.push(new docxLib.Paragraph({
              children: [new docxLib.PageBreak()]
            }));
          }
        }

        // Create docx Document
        const docxDocument = new docxLib.Document({
          creator: 'SlowPDF Client-Side Engine',
          title: currentPdfName,
          description: 'Converted from PDF directly inside browser RAM',
          sections: [{
            properties: {},
            children: docxChildren.length > 0 ? docxChildren : [
              new docxLib.Paragraph({ children: [new docxLib.TextRun({ text: 'Extracted PDF Document Content', size: 24 })] })
            ]
          }]
        });

        // Pack into Blob
        const blob = await docxLib.Packer.toBlob(docxDocument);
        const downloadUrl = URL.createObjectURL(blob);

        const successFilenameInput = document.getElementById('success-filename-input');
        const userBaseName = outputFilenameInput.value.trim() || 'SlowPDF_Word_Document';
        const cleanName = userBaseName.replace(/\.docx$/i, '').trim();

        if (successFilenameInput) {
          successFilenameInput.value = cleanName;
          successFilenameInput.oninput = () => {
            let name = successFilenameInput.value.trim().replace(/\.docx$/i, '').trim() || cleanName;
            downloadWordBtn.download = `${name}.docx`;
            downloadWordBtn.setAttribute('download', `${name}.docx`);
          };
        }

        const finalFileName = `${cleanName}.docx`;
        downloadWordBtn.href = downloadUrl;
        downloadWordBtn.download = finalFileName;
        downloadWordBtn.setAttribute('download', finalFileName);

        const totalSize = formatBytes(blob.size);
        successDescription.textContent = `Successfully reconstructed ${pdfPageCount} PDF page${pdfPageCount > 1 ? 's' : ''} into a fully editable Word document (${totalSize}).`;

        activeWorkbench.classList.add('hidden');
        successPanel.classList.remove('hidden');

      } catch (err) {
        console.error('Error synthesizing Word document:', err);
        alert('An error occurred while building the Word document. Please make sure the PDF contains selectable text.');
      } finally {
        convertActionBtn.disabled = false;
        convertBtnText.textContent = 'Convert to Word (.docx)';
      }
    });

    // Reset Workbench
    resetWorkbenchBtn.addEventListener('click', () => {
      currentPdfBuffer = null;
      emptyDropzone.classList.remove('hidden');
      activeWorkbench.classList.add('hidden');
      successPanel.classList.add('hidden');
      fileInput.value = '';
    });

    // 5. Accordion FAQ Toggle
    document.querySelectorAll('.faq-item').forEach(item => {
      const trigger = item.querySelector('.faq-trigger');
      const content = item.querySelector('.faq-content');
      const icon = item.querySelector('.faq-icon svg');

      if (trigger && content) {
        trigger.addEventListener('click', () => {
          const isOpen = !content.classList.contains('hidden');
          if (isOpen) {
            content.classList.add('hidden');
            if (icon) icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>';
          } else {
            content.classList.remove('hidden');
            if (icon) icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"/>';
          }
        });
      }
    });

    const toggleFaqsBtn = document.getElementById('toggle-faqs-btn');
    const extraFaqs = document.getElementById('extra-faqs');
    const faqBtnText = document.getElementById('faq-btn-text');
    const faqChevron = document.getElementById('faq-chevron');
    let faqsExpanded = false;

    if (toggleFaqsBtn && extraFaqs) {
      toggleFaqsBtn.addEventListener('click', () => {
        faqsExpanded = !faqsExpanded;
        if (faqsExpanded) {
          extraFaqs.classList.remove('hidden');
          faqBtnText.textContent = 'Show Fewer Questions';
          faqChevron.classList.add('rotate-180');
        } else {
          extraFaqs.classList.add('hidden');
          faqBtnText.textContent = 'View All 10 Questions';
          faqChevron.classList.remove('rotate-180');
        }
      });
    }
  </script>
