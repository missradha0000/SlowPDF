<script>
  (function() {
    function initMenu() {
      const menuBtn = document.getElementById('mobileMenuBtn') || document.getElementById('hamburger-btn') || document.querySelector('.mobile-menu-btn') || document.querySelector('.menu-icon');
      const drawer = document.getElementById('mobileMenuDrawer');
      const closeBtn = document.getElementById('closeMenuBtn');
      
      if (!menuBtn || !drawer) return;

      menuBtn.onclick = function(e) {
        e.preventDefault();
        e.stopPropagation();
        drawer.style.display = (drawer.style.display === 'none' || drawer.style.display === '') ? 'flex' : 'none';
      };

      if (closeBtn) {
        closeBtn.onclick = function(e) {
          e.preventDefault();
          drawer.style.display = 'none';
        };
      }

      document.addEventListener('click', function(e) {
        if (drawer.style.display === 'flex' && !drawer.contains(e.target) && !menuBtn.contains(e.target)) {
          drawer.style.display = 'none';
        }
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initMenu);
    } else {
      initMenu();
    }
  })();
</script>
