            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>

          <!-- Instagram (#E1306C / Gradient) -->
          <a href="https://instagram.com" target="_blank" rel="noopener noreferrer"

             style="background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);"
             aria-label="Instagram" title="Instagram">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
          </a>
          <!-- Facebook (#1877F2) -->
          <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" 
             class="w-8 h-8 rounded-full bg-[#1877F2] text-white flex items-center justify-center shadow-xs hover:scale-110 transition-transform" 
             aria-label="Facebook" title="Facebook">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          </a>
          <!-- X / Twitter (#000000) -->
          <a href="https://x.com" target="_blank" rel="noopener noreferrer" 
             class="w-8 h-8 rounded-full bg-black text-white flex items-center justify-center shadow-xs hover:scale-110 transition-transform dark:bg-stone-800" 
             aria-label="X / Twitter" title="X / Twitter">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          </a>
        </div>
      </div>

      <!-- Bottom Drawer Credit -->
      <div class="pt-3 mt-3 border-t border-stone-100 dark:border-stone-700/60 text-center">
        <p class="text-xs font-medium text-stone-500 dark:text-stone-400">Crafted with ❤️ by Tveezal</p>
      </div>

</footer>

  <!-- ========================================== -->
  <!-- JAVASCRIPT CONVERSION ENGINE               -->
  <!-- ========================================== -->
  <script>
    // 1. Configure PDF.js Worker
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // 2. Dark Mode Switcher
    const darkModeToggle = document.getElementById('dark-mode-toggle');
    const darkModeThumb = document.getElementById('dark-mode-thumb');

    function applyTheme(isDark) {
      if (isDark) {
        document.documentElement.classList.add('dark');
        if (darkModeToggle) {
          darkModeToggle.setAttribute('aria-checked', 'true');
          darkModeToggle.classList.remove('bg-stone-300');
          darkModeToggle.classList.add('bg-[#355E4B]');
        }
        if (darkModeThumb) {
          darkModeThumb.classList.remove('translate-x-0');
          darkModeThumb.classList.add('translate-x-5');
        }
      } else {
        document.documentElement.classList.remove('dark');
        if (darkModeToggle) {
          darkModeToggle.setAttribute('aria-checked', 'false');
          darkModeToggle.classList.remove('bg-[#355E4B]');
          darkModeToggle.classList.add('bg-stone-300');
        }
        if (darkModeThumb) {
          darkModeThumb.classList.remove('translate-x-5');
          darkModeThumb.classList.add('translate-x-0');
        }
      }
    }

    const savedTheme = localStorage.getItem('slowpdf_theme');
    const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(savedTheme ? savedTheme === 'dark' : systemPrefersDark);

    if (darkModeToggle) {
      darkModeToggle.addEventListener('click', () => {
        const isDark = document.documentElement.classList.contains('dark');
        applyTheme(!isDark);
        localStorage.setItem('slowpdf_theme', !isDark ? 'dark' : 'light');
      });
    }

    // 3. Hamburger Menu
    const hamburgerBtn = document.getElementById('hamburger-btn');
    const menuModal = document.getElementById('menu-modal');
    const modalCard = document.getElementById('modal-card');
    const closeModalBtn = document.getElementById('close-modal-btn');
    let menuOpen = false;

    function openMenu() {
      menuOpen = true;
      menuModal.classList.remove('hidden');
      requestAnimationFrame(() => {
        menuModal.classList.remove('opacity-0');
        modalCard.classList.remove('scale-95');
        modalCard.classList.add('scale-100');
      });
    }
    function closeMenu() {
      menuOpen = false;
      menuModal.classList.add('opacity-0');
      modalCard.classList.remove('scale-100');
      modalCard.classList.add('scale-95');
      setTimeout(() => { if (!menuOpen) menuModal.classList.add('hidden'); }, 300);
    }
    // (Navigation and modal drawer handled universally by nav-memory.js);

    // 4. PDF to JPG Conversion Engine State
    let currentPdfBuffer = null;
    let currentPdfName = '';
    let pdfPageCount = 0;
    let pdfDocInstance = null;
    let selectedPageIndices = []; // 1-indexed page numbers e.g. [1, 2, 3]
    let currentDpiScale = 2.0; // 2.0 for High Quality, 3.5 for Ultra HD

    const emptyDropzone = document.getElementById('empty-dropzone');
    const activeWorkbench = document.getElementById('active-workbench');
    const successPanel = document.getElementById('success-panel');
    const fileInput = document.getElementById('pdf-file-input');
    const browseBtn = document.getElementById('browse-btn');
    const changeFileBtn = document.getElementById('change-file-btn');
    const fileTitleDisplay = document.getElementById('file-title-display');
    const fileMetaDisplay = document.getElementById('file-meta-display');
    const pageThumbnailsGrid = document.getElementById('page-thumbnails-grid');
    const selectedPagesCount = document.getElementById('selected-pages-count');
    const selectAllPagesBtn = document.getElementById('select-all-pages-btn');
    const deselectAllPagesBtn = document.getElementById('deselect-all-pages-btn');
    const dpiHighBtn = document.getElementById('dpi-high-btn');
    const dpiUltraHDBtn = document.getElementById('dpi-ultrahd-btn');
    const outputFilenameInput = document.getElementById('output-filename');
    const filenameExtTag = document.getElementById('filename-ext-tag');
    const convertActionBtn = document.getElementById('convert-action-btn');
    const convertBtnText = document.getElementById('convert-btn-text');
    const downloadJpgBtn = document.getElementById('download-jpg-btn');
    const downloadBtnLabel = document.getElementById('download-btn-label');
    const resetWorkbenchBtn = document.getElementById('reset-workbench-btn');
    const successDescription = document.getElementById('success-description');
    const successExtTag = document.getElementById('success-ext-tag');

    emptyDropzone.addEventListener('click', () => fileInput.click());
    if (browseBtn) browseBtn.addEventListener('click', (e) => { e.stopPropagation(); fileInput.click(); });
    if (changeFileBtn) changeFileBtn.addEventListener('click', () => fileInput.click());

    ['dragenter', 'dragover'].forEach(evt => {
      emptyDropzone.addEventListener(evt, (e) => {
        e.preventDefault(); e.stopPropagation();
        emptyDropzone.classList.add('dragover-active');
      });
    });
    ['dragleave', 'drop'].forEach(evt => {
      emptyDropzone.addEventListener(evt, (e) => {
        e.preventDefault(); e.stopPropagation();
        emptyDropzone.classList.remove('dragover-active');
      });
    });
    emptyDropzone.addEventListener('drop', (e) => {
      const files = Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
      if (files.length > 0) processSelectedFile(files[0]);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) processSelectedFile(e.target.files[0]);
    });

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024, sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // DPI Quality Selector Toggle
    dpiHighBtn.addEventListener('click', () => {
      currentDpiScale = 2.0;
      dpiHighBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all bg-[#355E4B] text-white shadow-2xs';
      dpiUltraHDBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-bold text-stone-600 dark:text-stone-400 hover:text-stone-900 dark:hover:text-white transition-all';
    });
    dpiUltraHDBtn.addEventListener('click', () => {
      currentDpiScale = 3.5;
      dpiUltraHDBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all bg-[#355E4B] text-white shadow-2xs';
      dpiHighBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-bold text-stone-600 dark:text-stone-400 hover:text-stone-900 dark:hover:text-white transition-all';
    });

    // Process Selected PDF File
    async function processSelectedFile(file) {
      currentPdfName = file.name;
      const cleanBaseName = file.name.replace(/\.pdf$/i, '').trim();
      outputFilenameInput.value = `SlowPDF_JPG_${cleanBaseName}`;

      try {
        currentPdfBuffer = await file.arrayBuffer();
        const loadingTask = pdfjsLib.getDocument({ data: currentPdfBuffer.slice(0) });
        pdfDocInstance = await loadingTask.promise;
        pdfPageCount = pdfDocInstance.numPages;

        fileTitleDisplay.textContent = file.name;
        fileMetaDisplay.textContent = `Size: ${formatBytes(file.size)} • Total Pages: ${pdfPageCount}`;

        // Select all pages by default
        selectedPageIndices = Array.from({ length: pdfPageCount }, (_, i) => i + 1);

        emptyDropzone.classList.add('hidden');
        activeWorkbench.classList.remove('hidden');
        successPanel.classList.add('hidden');

        await renderThumbnailsGrid();
        updateSelectedPagesUI();

      } catch (err) {
        console.error('Error reading PDF file:', err);
        alert('Could not parse PDF document. Please make sure it is a valid PDF file.');
      }
    }

    // Render Fast Visual Page Thumbnails
    async function renderThumbnailsGrid() {
      pageThumbnailsGrid.innerHTML = '';

      for (let pNum = 1; pNum <= pdfPageCount; pNum++) {
        const item = document.createElement('div');
        item.className = 'relative p-2 rounded-xl border border-stone-200 dark:border-stone-800 bg-white dark:bg-[#1C2420] shadow-2xs flex flex-col items-center justify-between cursor-pointer hover:border-[#355E4B] transition-all group select-none';
        item.dataset.pageNum = pNum;

        const canvas = document.createElement('canvas');
        canvas.className = 'w-full h-auto rounded-lg shadow-2xs object-contain bg-white mb-2';

        // Render low-res preview canvas
        const page = await pdfDocInstance.getPage(pNum);
        const viewport = page.getViewport({ scale: 0.25 });
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        const renderContext = {
          canvasContext: canvas.getContext('2d'),
          viewport: viewport
        };
        page.render(renderContext);

        const checkMark = document.createElement('div');
        checkMark.className = 'page-check-indicator w-5 h-5 rounded-full bg-[#355E4B] text-white flex items-center justify-center absolute top-3 right-3 shadow-sm transition-transform';
        checkMark.innerHTML = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>';

        const pageLabel = document.createElement('span');
        pageLabel.className = 'text-xs font-bold text-stone-600 dark:text-stone-300';
        pageLabel.textContent = `Page ${pNum}`;

        item.appendChild(canvas);
        item.appendChild(checkMark);
        item.appendChild(pageLabel);

        // Toggle selection on click
        item.addEventListener('click', () => {
          if (selectedPageIndices.includes(pNum)) {
            selectedPageIndices = selectedPageIndices.filter(p => p !== pNum);
          } else {
            selectedPageIndices.push(pNum);
            selectedPageIndices.sort((a, b) => a - b);
          }
          updateSelectedPagesUI();
        });

        pageThumbnailsGrid.appendChild(item);
      }
    }

    // Update Thumbnail Selection States
    function updateSelectedPagesUI() {
      selectedPagesCount.textContent = selectedPageIndices.length;

      document.querySelectorAll('#page-thumbnails-grid > div').forEach(card => {
        const pNum = parseInt(card.dataset.pageNum, 10);
        const isSelected = selectedPageIndices.includes(pNum);
        const checkIndicator = card.querySelector('.page-check-indicator');

        if (isSelected) {
          card.classList.remove('opacity-40', 'grayscale');
          card.classList.add('border-[#355E4B]', 'ring-2', 'ring-[#355E4B]/30');
          if (checkIndicator) checkIndicator.classList.remove('hidden');
        } else {
          card.classList.add('opacity-40', 'grayscale');
          card.classList.remove('border-[#355E4B]', 'ring-2', 'ring-[#355E4B]/30');
          if (checkIndicator) checkIndicator.classList.add('hidden');
        }
      });

      const isMulti = selectedPageIndices.length > 1;
      filenameExtTag.textContent = isMulti ? '.zip' : '.jpg';
      convertBtnText.textContent = isMulti ? `Convert ${selectedPageIndices.length} Pages to JPG (.zip)` : 'Convert to JPG Image';
      convertActionBtn.disabled = selectedPageIndices.length === 0;
    }

    selectAllPagesBtn.addEventListener('click', () => {
      selectedPageIndices = Array.from({ length: pdfPageCount }, (_, i) => i + 1);
      updateSelectedPagesUI();
    });
    deselectAllPagesBtn.addEventListener('click', () => {
      selectedPageIndices = [];
      updateSelectedPagesUI();
    });

    // Execute Client-Side High-Res JPG Rendering Engine
    convertActionBtn.addEventListener('click', async () => {
      if (selectedPageIndices.length === 0 || !pdfDocInstance) return;

      convertActionBtn.disabled = true;
      convertBtnText.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Rendering High-Res JPG Canvas...
      `;

      try {
        const isMulti = selectedPageIndices.length > 1;
        const baseName = outputFilenameInput.value.trim().replace(/(\.jpg|\.zip)+$/i, '').trim() || 'SlowPDF_JPG_Document';

        if (isMulti) {
          // Multi-page conversion: Bundle into JSZip (.zip)
          const zip = new JSZip();

          for (let idx = 0; idx < selectedPageIndices.length; idx++) {
            const pNum = selectedPageIndices[idx];
            const page = await pdfDocInstance.getPage(pNum);
            const viewport = page.getViewport({ scale: currentDpiScale });

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await page.render({ canvasContext: ctx, viewport: viewport }).promise;

            // Convert canvas to JPEG blob
            const imageBlob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.95));
            const pageFileName = `${baseName}_Page_${pNum}.jpg`;
            zip.file(pageFileName, imageBlob);
          }

          // Generate ZIP archive blob
          const zipBlob = await zip.generateAsync({ type: 'blob' });
          const downloadUrl = URL.createObjectURL(zipBlob);

          setupDownloadView(downloadUrl, `${baseName}.zip`, '.zip', `Successfully converted ${selectedPageIndices.length} pages into high-resolution JPG images and bundled them into a clean ZIP file (${formatBytes(zipBlob.size)}).`, 'Download All JPGs (.zip)');

        } else {
          // Single-page conversion: Direct .jpg file
          const pNum = selectedPageIndices[0];
          const page = await pdfDocInstance.getPage(pNum);
          const viewport = page.getViewport({ scale: currentDpiScale });

          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = viewport.width;
          canvas.height = viewport.height;

          await page.render({ canvasContext: ctx, viewport: viewport }).promise;

          const imageBlob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.95));
          const downloadUrl = URL.createObjectURL(imageBlob);

          setupDownloadView(downloadUrl, `${baseName}_Page_${pNum}.jpg`, '.jpg', `Successfully rendered PDF Page ${pNum} into a high-resolution JPG image (${formatBytes(imageBlob.size)}).`, 'Download JPG Image');
        }

      } catch (err) {
        console.error('Error rendering PDF to JPG:', err);
        alert('An error occurred while converting pages to JPG images.');
      } finally {
        convertActionBtn.disabled = false;
        updateSelectedPagesUI();
      }
    });

    function setupDownloadView(url, defaultFileName, extension, descriptionText, buttonLabel) {
      const successFilenameInput = document.getElementById('success-filename-input');
      const cleanName = defaultFileName.replace(new RegExp(`${extension.replace('.', '\\.')}$`, 'i'), '');

      successExtTag.textContent = extension;
      downloadBtnLabel.textContent = buttonLabel;

      if (successFilenameInput) {
        successFilenameInput.value = cleanName;
        successFilenameInput.oninput = () => {
          let name = successFilenameInput.value.trim().replace(new RegExp(`${extension.replace('.', '\\.')}$`, 'i'), '').trim() || cleanName;
          downloadJpgBtn.download = `${name}${extension}`;
          downloadJpgBtn.setAttribute('download', `${name}${extension}`);
        };
      }

      downloadJpgBtn.href = url;
      downloadJpgBtn.download = defaultFileName;
      downloadJpgBtn.setAttribute('download', defaultFileName);

      successDescription.textContent = descriptionText;

      activeWorkbench.classList.add('hidden');
      successPanel.classList.remove('hidden');
    }

    // Reset Workbench
    resetWorkbenchBtn.addEventListener('click', () => {
      currentPdfBuffer = null;
      pdfDocInstance = null;
      selectedPageIndices = [];
      emptyDropzone.classList.remove('hidden');
      activeWorkbench.classList.add('hidden');
      successPanel.classList.add('hidden');
      fileInput.value = '';
    });

    // 5. Accordion FAQ Toggle
    document.querySelectorAll('.faq-item').forEach(item => {
      const trigger = item.querySelector('.faq-trigger');
      const content = item.querySelector('.faq-content');
      const icon = item.querySelector('.faq-icon svg');

      if (trigger && content) {
        trigger.addEventListener('click', () => {
          const isOpen = !content.classList.contains('hidden');
          if (isOpen) {
            content.classList.add('hidden');
            if (icon) icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>';
          } else {
            content.classList.remove('hidden');
            if (icon) icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"/>';
          }
        });
      }
    });

    const toggleFaqsBtn = document.getElementById('toggle-faqs-btn');
    const extraFaqs = document.getElementById('extra-faqs');
    const faqBtnText = document.getElementById('faq-btn-text');
    const faqChevron = document.getElementById('faq-chevron');
    let faqsExpanded = false;

    if (toggleFaqsBtn && extraFaqs) {
      toggleFaqsBtn.addEventListener('click', () => {
        faqsExpanded = !faqsExpanded;
        if (faqsExpanded) {
          extraFaqs.classList.remove('hidden');
          faqBtnText.textContent = 'Show Fewer Questions';
          faqChevron.classList.add('rotate-180');
        } else {
          extraFaqs.classList.add('hidden');
          faqBtnText.textContent = 'View All 10 Questions';
          faqChevron.classList.remove('rotate-180');
        }
      });
    }
  </script>
