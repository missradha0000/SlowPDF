  <script>
    // Configure PDF.js Worker
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    // ----------------------------------------------------
    // 1. DARK MODE THEME PERSISTENCE
    // ----------------------------------------------------
    const darkModeToggle = document.getElementById('dark-mode-toggle');
    const darkModeThumb = document.getElementById('dark-mode-thumb');

    function applyTheme(isDark) {
      if (isDark) {
        document.documentElement.classList.add('dark');
        if (darkModeToggle) {
          darkModeToggle.setAttribute('aria-checked', 'true');
          darkModeToggle.classList.remove('bg-stone-300');
          darkModeToggle.classList.add('bg-[#355E4B]');
        }
        if (darkModeThumb) {
          darkModeThumb.classList.remove('translate-x-0');
          darkModeThumb.classList.add('translate-x-5');
        }
      } else {
        document.documentElement.classList.remove('dark');
        if (darkModeToggle) {
          darkModeToggle.setAttribute('aria-checked', 'false');
          darkModeToggle.classList.remove('bg-[#355E4B]');
          darkModeToggle.classList.add('bg-stone-300');
        }
        if (darkModeThumb) {
          darkModeThumb.classList.remove('translate-x-5');
          darkModeThumb.classList.add('translate-x-0');
        }
      }
    }

    const savedTheme = localStorage.getItem('slowpdf_theme');
    const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const initialDark = savedTheme ? savedTheme === 'dark' : systemPrefersDark;
    applyTheme(initialDark);

    if (darkModeToggle) {
      darkModeToggle.addEventListener('click', () => {
        const isCurrentDark = document.documentElement.classList.contains('dark');
        const nextDark = !isCurrentDark;
        applyTheme(nextDark);
        localStorage.setItem('slowpdf_theme', nextDark ? 'dark' : 'light');
      });
    }

    // (Handled by menu-modal & nav-memory.js)
    // ----------------------------------------------------

    // ----------------------------------------------------
    // 3. CLIENT-SIDE UNLOCK PDF ENGINE
    // ----------------------------------------------------
    let currentFileBuffer = null;
    let currentFileName = '';
    let currentFileSize = 0;
    let currentNumPages = 0;
    let isOwnerRestrictionOnly = false;
    let requiresUserPassword = false;

    const emptyDropzone = document.getElementById('empty-dropzone');
    const activeWorkbench = document.getElementById('active-workbench');
    const successPanel = document.getElementById('success-panel');
    const fileInput = document.getElementById('pdf-file-input');
    const browseBtn = document.getElementById('browse-btn');
    const chooseDifferentFileBtn = document.getElementById('choose-different-file-btn');
    const fileNameText = document.getElementById('file-name-text');
    const fileSizeText = document.getElementById('file-size-text');
    const alertBox = document.getElementById('alert-box');
    const alertIcon = document.getElementById('alert-icon');
    const alertMessage = document.getElementById('alert-message');
    const passwordFormSection = document.getElementById('password-form-section');
    const pdfPasswordInput = document.getElementById('pdf-password-input');
    const togglePasswordVisibilityBtn = document.getElementById('toggle-password-visibility-btn');
    const eyeIcon = document.getElementById('eye-icon');
    const eyeSlashIcon = document.getElementById('eye-slash-icon');
    const unlockActionBtn = document.getElementById('unlock-action-btn');
    const unlockBtnText = document.getElementById('unlock-btn-text');
    const directUnlockSection = document.getElementById('direct-unlock-section');
    const directUnlockDesc = document.getElementById('direct-unlock-desc');
    const instantStripBtn = document.getElementById('instant-strip-btn');
    const instantStripBtnText = document.getElementById('instant-strip-btn-text');
    const downloadUnlockedBtn = document.getElementById('download-unlocked-btn');
    const resetWorkbenchBtn = document.getElementById('reset-workbench-btn');
    const unlockedFileName = document.getElementById('unlocked-file-name');
    const unlockedFileStats = document.getElementById('unlocked-file-stats');
    const outputFilenameInput = document.getElementById('output-filename-input');

    // Trigger file chooser
    if (emptyDropzone) {
      emptyDropzone.addEventListener('click', (e) => {
        if (e.target === browseBtn || browseBtn.contains(e.target)) return;
        fileInput.click();
      });
    }
    if (browseBtn) {
      browseBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        fileInput.click();
      });
    }
    if (chooseDifferentFileBtn) {
      chooseDifferentFileBtn.addEventListener('click', () => fileInput.click());
    }

    // Drag and drop handlers
    ['dragenter', 'dragover'].forEach(evt => {
      emptyDropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        emptyDropzone.classList.add('dragover-active');
      });
    });
    ['dragleave', 'drop'].forEach(evt => {
      emptyDropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        emptyDropzone.classList.remove('dragover-active');
      });
    });
    emptyDropzone.addEventListener('drop', (e) => {
      const files = Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
      if (files.length > 0) handleIncomingFile(files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length > 0) handleIncomingFile(files[0]);
      fileInput.value = '';
    });

    // Password visibility toggle
    let passwordVisible = false;
    if (togglePasswordVisibilityBtn) {
      togglePasswordVisibilityBtn.addEventListener('click', () => {
        passwordVisible = !passwordVisible;
        pdfPasswordInput.type = passwordVisible ? 'text' : 'password';
        if (passwordVisible) {
          eyeIcon.classList.add('hidden');
          eyeSlashIcon.classList.remove('hidden');
        } else {
          eyeIcon.classList.remove('hidden');
          eyeSlashIcon.classList.add('hidden');
        }
      });
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function showAlert(type, message) {
      alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-800', 'border-red-200', 'dark:bg-red-950/40', 'dark:text-red-300', 'dark:border-red-800', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200', 'dark:bg-emerald-950/40', 'dark:text-emerald-300', 'dark:border-emerald-800', 'bg-amber-50', 'text-amber-800', 'border-amber-200', 'dark:bg-amber-950/40', 'dark:text-amber-300', 'dark:border-amber-800');
      
      if (type === 'error') {
        alertBox.classList.add('bg-red-50', 'text-red-800', 'border-red-200', 'dark:bg-red-950/40', 'dark:text-red-300', 'dark:border-red-800');
        alertIcon.innerHTML = `<svg class="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>`;
      } else if (type === 'success') {
        alertBox.classList.add('bg-emerald-50', 'text-emerald-800', 'border-emerald-200', 'dark:bg-emerald-950/40', 'dark:text-emerald-300', 'dark:border-emerald-800');
        alertIcon.innerHTML = `<svg class="w-5 h-5 text-emerald-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>`;
      } else {
        alertBox.classList.add('bg-amber-50', 'text-amber-800', 'border-amber-200', 'dark:bg-amber-950/40', 'dark:text-amber-300', 'dark:border-amber-800');
        alertIcon.innerHTML = `<svg class="w-5 h-5 text-amber-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>`;
      }
      alertMessage.textContent = message;
    }

    function hideAlert() {
      alertBox.classList.add('hidden');
    }

    // Inspect and process incoming file
    async function handleIncomingFile(file) {
      try {
        currentFileName = file.name || 'document.pdf';
        currentFileSize = file.size || 0;
        currentFileBuffer = await file.arrayBuffer();

        fileNameText.textContent = currentFileName;
        fileSizeText.textContent = `${formatBytes(currentFileSize)} • Checking encryption...`;
        hideAlert();
        pdfPasswordInput.value = '';

        // Switch to active workbench
        emptyDropzone.classList.add('hidden');
        successPanel.classList.add('hidden');
        activeWorkbench.classList.remove('hidden');

        // Test encryption status using PDF.js and PDFLib
        let isOpenableWithoutPassword = false;
        let isEncryptedDoc = false;

        try {
          const loadingTask = pdfjsLib.getDocument({
            data: new Uint8Array(currentFileBuffer.slice(0)),
            password: ''
          });
          const pdfDoc = await loadingTask.promise;
          isOpenableWithoutPassword = true;
          currentNumPages = pdfDoc.numPages;

          // Check if it has encryption trailer via PDFLib
          try {
            const pdfLibDoc = await PDFLib.PDFDocument.load(currentFileBuffer.slice(0), { ignoreEncryption: true });
            const hasTrailerEncrypt = Boolean(pdfLibDoc.context.trailerInfo?.Encrypt || pdfLibDoc.isEncrypted);
            if (hasTrailerEncrypt) {
              isEncryptedDoc = true;
              isOwnerRestrictionOnly = true;
            }
          } catch (e) {
            isEncryptedDoc = true;
            isOwnerRestrictionOnly = true;
          }

        } catch (err) {
          // If PDF.js threw PasswordException (code 1 = need password)
          if (err.name === 'PasswordException' || err.code === 1 || err.code === 2 || err.message?.toLowerCase().includes('password')) {
            isEncryptedDoc = true;
            requiresUserPassword = true;
            isOwnerRestrictionOnly = false;
          }
        }

        if (requiresUserPassword) {
          fileSizeText.textContent = `${formatBytes(currentFileSize)} • Password Protected Document`;
          passwordFormSection.classList.remove('hidden');
          directUnlockSection.classList.add('hidden');
          pdfPasswordInput.focus();
        } else if (isOwnerRestrictionOnly) {
          fileSizeText.textContent = `${formatBytes(currentFileSize)} • ${currentNumPages} Pages • Permissions Locked`;
          passwordFormSection.classList.add('hidden');
          directUnlockSection.classList.remove('hidden');
          directUnlockDesc.textContent = "This document can be opened without a password, but contains print, edit, or copy restriction flags. SlowPDF will strip these restrictions now.";
          instantStripBtnText.textContent = "Strip Restrictions & Download Clean PDF";
        } else {
          // Completely unencrypted PDF
          fileSizeText.textContent = `${formatBytes(currentFileSize)} • ${currentNumPages} Pages • Unrestricted`;
          passwordFormSection.classList.add('hidden');
          directUnlockSection.classList.remove('hidden');
          directUnlockDesc.textContent = "This document is already unrestricted and has no password.";
          instantStripBtnText.textContent = "Download Unrestricted Copy";
          showAlert('info', "This document is already unrestricted and has no password.");
        }

      } catch (err) {
        console.error('Error reading PDF:', err);
        showAlert('error', 'Unable to parse this PDF file. Please ensure the file is a valid PDF document.');
      }
    }

    // Convert data URL to binary Uint8Array synchronously
    function dataUrlToUint8Array(dataUrl) {
      const base64 = dataUrl.substring(dataUrl.indexOf(',') + 1);
      const binary = atob(base64);
      const len = binary.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    // Execute Decryption Logic (PDF.js + PDF-Lib Clean Engine)
    async function executeDecryption(password = '') {
      hideAlert();
      unlockActionBtn.disabled = true;
      instantStripBtn.disabled = true;
      unlockBtnText.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Decrypting in RAM...
      `;
      instantStripBtnText.innerHTML = unlockBtnText.innerHTML;

      try {
        // Step A: Load the document using PDF.js with user password to fully decrypt all streams & dictionaries
        let pdfDoc;
        try {
          const loadingTask = pdfjsLib.getDocument({
            data: new Uint8Array(currentFileBuffer.slice(0)),
            password: password
          });
          pdfDoc = await loadingTask.promise;
        } catch (pwErr) {
          if (pwErr.name === 'PasswordException' || pwErr.code === 2 || pwErr.message?.toLowerCase().includes('password')) {
            showAlert('error', 'Incorrect password. Please verify and try again.');
            pdfPasswordInput.focus();
            pdfPasswordInput.select();
            return;
          } else {
            throw pwErr;
          }
        }

        const numPages = pdfDoc.numPages;

        // Step B & C: Re-encode into an unrestricted PDF standard (PDF 1.7) ensuring all encryption dictionaries (/Encrypt) and permission flags are completely stripped
        const PDFDocument = window.PDFLib.PDFDocument;
        const cleanDoc = await PDFDocument.create();

        // Optional standard font for invisible selectable text layer
        let standardFont = null;
        try {
          standardFont = await cleanDoc.embedFont(window.PDFLib.StandardFonts.Helvetica);
        } catch (fontErr) {
          console.warn('Standard font embed fallback:', fontErr);
        }

        // Render each decrypted page preserving 100% of vector text, fonts, tables, and images
        for (let pageNum = 1; pageNum <= numPages; pageNum++) {
          unlockBtnText.innerHTML = `
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Processing Page ${pageNum} of ${numPages}...
          `;
          instantStripBtnText.innerHTML = unlockBtnText.innerHTML;

          const page = await pdfDoc.getPage(pageNum);
          const origViewport = page.getViewport({ scale: 1.0 });
          const width = origViewport.width;
          const height = origViewport.height;

          // Render at high-density scale (2.0x for retina/print crispness, ~150-200 DPI)
          const scale = 2.0;
          const renderViewport = page.getViewport({ scale: scale });

          const canvas = document.createElement('canvas');
          canvas.width = Math.floor(renderViewport.width);
          canvas.height = Math.floor(renderViewport.height);
          const ctx = canvas.getContext('2d', { alpha: false });

          // Fill solid white background so transparent elements remain crisp and non-inverted
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Render full-fidelity content: vector curves, fonts, tables, shapes, and images
          await page.render({
            canvasContext: ctx,
            viewport: renderViewport
          }).promise;

          // Convert canvas to image bytes synchronously without network requests
          const imgDataUrl = canvas.toDataURL('image/png');
          const imgBytes = dataUrlToUint8Array(imgDataUrl);

          // Embed high-res lossless image into fresh PDF 1.7 document
          const embeddedImg = await cleanDoc.embedPng(imgBytes);

          // Add clean page matching exact original dimensions
          const newPage = cleanDoc.addPage([width, height]);
          newPage.drawImage(embeddedImg, {
            x: 0,
            y: 0,
            width: width,
            height: height
          });

          // Overlay invisible text layer for copy-pasting and searching in Adobe Acrobat & Google Drive
          if (standardFont) {
            try {
              const textContent = await page.getTextContent();
              if (textContent && textContent.items && textContent.items.length > 0) {
                for (const item of textContent.items) {
                  if (!item.str || item.str.trim() === '') continue;
                  const tx = item.transform[4];
                  const ty = item.transform[5];
                  const fontSize = Math.max(4, Math.min(72, Math.hypot(item.transform[0], item.transform[1])));
                  
                  newPage.drawText(item.str, {
                    x: tx,
                    y: ty,
                    size: fontSize,
                    font: standardFont,
                    opacity: 0
                  });
                }
              }
            } catch (txtErr) {
              // Visual page is already complete
            }
          }
        }

        // Step D: Re-assemble clean PDF bytes ensuring valid xref table, trailer, and MIME type application/pdf
        const pdfBytes = await cleanDoc.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const downloadUrl = URL.createObjectURL(blob);

        // Smart File Name Sanitizer:
        // Cleans up long random hashes (e.g. 78445bb36ce...), fallback to Document if over 20 chars
        function sanitizeBaseName(rawName) {
          if (!rawName) return 'Document';
          let clean = rawName.replace(/\.pdf$/i, '').trim();

          // Detect hex hashes (8+ consecutive hex characters) or UUIDs or excessively long names
          const hasLongHex = /[0-9a-fA-F]{8,}/.test(clean);
          const hasUuid = /[0-9a-fA-F]{8}-[0-9a-fA-F]{4}/.test(clean);
          const isTooLong = clean.length > 20;

          if (hasLongHex || hasUuid || isTooLong) {
            // Check for a meaningful clean sub-word (e.g. "Invoice_78445bb..." or "..._signedFinal")
            const parts = clean.split(/[_\-\s]+/).filter(p => 
              !/[0-9a-fA-F]{8,}/.test(p) && 
              !/^[0-9]+$/.test(p) && 
              p.length >= 3 && 
              p.length <= 15
            );
            if (parts.length > 0) {
              const candidate = parts[0].replace(/[^a-zA-Z0-9]/g, '');
              if (candidate.length >= 3 && candidate.length <= 15) {
                return candidate.charAt(0).toUpperCase() + candidate.slice(1);
              }
            }
            return 'Document';
          }

          // Clean up special characters, keep alphanumeric and underscores
          clean = clean.replace(/[^a-zA-Z0-9_-]/g, '_').replace(/_+/g, '_').replace(/^_+|_+$/g, '');
          if (clean.length === 0 || clean.length > 15) {
            return 'Document';
          }
          return clean.charAt(0).toUpperCase() + clean.slice(1);
        }

        const shortName = sanitizeBaseName(currentFileName);
        const defaultBaseName = `SlowPDF_Unlocked_${shortName}`;

        // Helper to compute final download name ensuring exactly ONE clean .pdf extension
        function computeFinalFileName() {
          let userVal = (outputFilenameInput && outputFilenameInput.value ? outputFilenameInput.value.trim() : '') || defaultBaseName;
          // Strip any trailing .pdf (or accidental duplicate .pdf.pdf)
          userVal = userVal.replace(/(\.pdf)+$/i, '').trim();
          if (!userVal) userVal = defaultBaseName;
          return `${userVal}.pdf`;
        }

        // Set default value in the input field
        if (outputFilenameInput) {
          outputFilenameInput.value = defaultBaseName;
          outputFilenameInput.oninput = () => {
            const currentName = computeFinalFileName();
            downloadUnlockedBtn.download = currentName;
            downloadUnlockedBtn.setAttribute('download', currentName);
            unlockedFileName.textContent = currentName;
          };
        }

        const finalDownloadName = computeFinalFileName();
        downloadUnlockedBtn.href = downloadUrl;
        downloadUnlockedBtn.download = finalDownloadName;
        downloadUnlockedBtn.setAttribute('download', finalDownloadName);
        unlockedFileName.textContent = finalDownloadName;
        unlockedFileStats.textContent = `${formatBytes(pdfBytes.byteLength)} • ${numPages} Page${numPages > 1 ? 's' : ''} • Fully Unlocked`;

        // Ensure latest filename on click
        downloadUnlockedBtn.onclick = () => {
          const latestName = computeFinalFileName();
          downloadUnlockedBtn.download = latestName;
          downloadUnlockedBtn.setAttribute('download', latestName);
        };

        // Switch to success view
        activeWorkbench.classList.add('hidden');
        successPanel.classList.remove('hidden');

      } catch (err) {
        console.error('Decryption failed:', err);
        showAlert('error', 'An unexpected error occurred while decrypting the PDF. Please verify the password and document integrity.');
      } finally {
        unlockActionBtn.disabled = false;
        instantStripBtn.disabled = false;
        unlockBtnText.textContent = 'Unlock PDF & Strip Restrictions';
        instantStripBtnText.textContent = isOwnerRestrictionOnly ? 'Strip Restrictions & Download Clean PDF' : 'Download Verified Unrestricted PDF';
      }
    }

    // Bind unlock actions
    unlockActionBtn.addEventListener('click', () => {
      const pw = pdfPasswordInput.value;
      if (!pw) {
        showAlert('error', 'Please enter the document password to unlock this file.');
        pdfPasswordInput.focus();
        return;
      }
      executeDecryption(pw);
    });

    pdfPasswordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const pw = pdfPasswordInput.value;
        if (!pw) {
          showAlert('error', 'Please enter the document password to unlock this file.');
          pdfPasswordInput.focus();
          return;
        }
        executeDecryption(pw);
      }
    });

    instantStripBtn.addEventListener('click', () => {
      executeDecryption('');
    });

    // Reset workbench
    resetWorkbenchBtn.addEventListener('click', () => {
      currentFileBuffer = null;
      currentFileName = '';
      currentFileSize = 0;
      currentNumPages = 0;
      isOwnerRestrictionOnly = false;
      requiresUserPassword = false;
      successPanel.classList.add('hidden');
      activeWorkbench.classList.add('hidden');
      emptyDropzone.classList.remove('hidden');
    });

    // ----------------------------------------------------
    // 4. ACCORDION FAQ LOGIC
    // ----------------------------------------------------
    document.querySelectorAll('.faq-item').forEach(item => {
      const trigger = item.querySelector('.faq-trigger');
      const content = item.querySelector('.faq-content');
      const icon = item.querySelector('.faq-icon svg');

      trigger.addEventListener('click', () => {
        const isOpen = !content.classList.contains('hidden');
        if (isOpen) {
          content.classList.add('hidden');
          icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>';
          item.classList.remove('ring-1', 'ring-[#355E4B]');
        } else {
          content.classList.remove('hidden');
          icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"/>';
          item.classList.add('ring-1', 'ring-[#355E4B]');
        }
      });
    });

    const toggleFaqsBtn = document.getElementById('toggle-faqs-btn');
    const extraFaqs = document.getElementById('extra-faqs');
    const faqBtnText = document.getElementById('faq-btn-text');
    const faqChevron = document.getElementById('faq-chevron');
    let faqsExpanded = false;

    if (toggleFaqsBtn && extraFaqs) {
      toggleFaqsBtn.addEventListener('click', () => {
        faqsExpanded = !faqsExpanded;
        if (faqsExpanded) {
          extraFaqs.classList.remove('hidden');
          faqBtnText.textContent = 'Show Fewer Questions';
          faqChevron.classList.add('rotate-180');
        } else {
          extraFaqs.classList.add('hidden');
          faqBtnText.textContent = 'View All 10 Questions';
          faqChevron.classList.remove('rotate-180');
        }
      });
    }
  </script>
