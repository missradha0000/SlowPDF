  <script>
    // Configure PDF.js Worker
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    // ----------------------------------------------------
    // 1. DARK MODE THEME PERSISTENCE
    // ----------------------------------------------------
    const darkModeToggle = document.getElementById('dark-mode-toggle');
    const darkModeThumb = document.getElementById('dark-mode-thumb');

    function applyTheme(isDark) {
      if (isDark) {
        document.documentElement.classList.add('dark');
        if (darkModeToggle) {
          darkModeToggle.setAttribute('aria-checked', 'true');
          darkModeToggle.classList.remove('bg-stone-300');
          darkModeToggle.classList.add('bg-[#355E4B]');
        }
        if (darkModeThumb) {
          darkModeThumb.classList.remove('translate-x-0');
          darkModeThumb.classList.add('translate-x-5');
        }
      } else {
        document.documentElement.classList.remove('dark');
        if (darkModeToggle) {
          darkModeToggle.setAttribute('aria-checked', 'false');
          darkModeToggle.classList.remove('bg-[#355E4B]');
          darkModeToggle.classList.add('bg-stone-300');
        }
        if (darkModeThumb) {
          darkModeThumb.classList.remove('translate-x-5');
          darkModeThumb.classList.add('translate-x-0');
        }
      }
    }

    const savedTheme = localStorage.getItem('slowpdf_theme');
    const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const initialDark = savedTheme ? savedTheme === 'dark' : systemPrefersDark;
    applyTheme(initialDark);

    if (darkModeToggle) {
      darkModeToggle.addEventListener('click', () => {
        const isCurrentDark = document.documentElement.classList.contains('dark');
        const nextDark = !isCurrentDark;
        applyTheme(nextDark);
        localStorage.setItem('slowpdf_theme', nextDark ? 'dark' : 'light');
      });
    }

    // ----------------------------------------------------
    // 2. HAMBURGER MENU MODAL
    // ----------------------------------------------------
    const hamburgerBtn = document.getElementById('hamburger-btn');
    const menuModal = document.getElementById('menu-modal');
    const modalCard = document.getElementById('modal-card');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const line1 = document.getElementById('line1');
    const line2 = document.getElementById('line2');
    const line3 = document.getElementById('line3');
    let menuOpen = false;

    function openMenu() {
      menuOpen = true;
      menuModal.classList.remove('hidden');
      requestAnimationFrame(() => {
        menuModal.classList.remove('opacity-0');
        modalCard.classList.remove('scale-95');
        modalCard.classList.add('scale-100');
      });
      line1.setAttribute('transform', 'rotate(45 12 12)');
      line2.classList.add('opacity-0');
      line3.setAttribute('transform', 'rotate(-45 12 12)');
      hamburgerBtn.setAttribute('aria-expanded', 'true');
    }

    function closeMenu() {
      menuOpen = false;
      menuModal.classList.add('opacity-0');
      modalCard.classList.remove('scale-100');
      modalCard.classList.add('scale-95');
      setTimeout(() => {
        if (!menuOpen) menuModal.classList.add('hidden');
      }, 300);
      line1.removeAttribute('transform');
      line2.classList.remove('opacity-0');
      line3.removeAttribute('transform');
      hamburgerBtn.setAttribute('aria-expanded', 'false');
    }

    // (Navigation and modal drawer handled universally by nav-memory.js)

    // ----------------------------------------------------

    let currentFileBuffer = null;
    let currentFileName = '';
    let currentFileSize = 0;

    const emptyDropzone = document.getElementById('empty-dropzone');

    const toggleConfirmBtn = document.getElementById('toggle-confirm-btn');
    const eyeIcon1 = document.getElementById('eye-icon-1');
    const eyeSlashIcon1 = document.getElementById('eye-slash-icon-1');
    const eyeIcon2 = document.getElementById('eye-icon-2');
    const eyeSlashIcon2 = document.getElementById('eye-slash-icon-2');

    // Trigger file chooser

        fileInput.click();
      });

    if (browseBtn) {
      browseBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        fileInput.click();

      chooseDifferentFileBtn.addEventListener('click', () => fileInput.click());
    }

    // Drag and drop handlers
    ['dragenter', 'dragover'].forEach(evt => {
      emptyDropzone.addEventListener(evt, (e) => {
        e.preventDefault();

        e.preventDefault();
        e.stopPropagation();
        emptyDropzone.classList.remove('dragover-active');
      });
    });
    emptyDropzone.addEventListener('drop', (e) => {
      const files = Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
      if (files.length > 0) handleIncomingFile(files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length > 0) handleIncomingFile(files[0]);
      fileInput.value = '';
    });

    // Password visibility toggles
    let pw1Visible = false;
    let pw2Visible = false;
    if (togglePasswordBtn) {
      togglePasswordBtn.addEventListener('click', () => {
        pw1Visible = !pw1Visible;
        pdfPasswordInput.type = pw1Visible ? 'text' : 'password';
        eyeIcon1.classList.toggle('hidden', pw1Visible);
        eyeSlashIcon1.classList.toggle('hidden', !pw1Visible);
      });
    }
    if (toggleConfirmBtn) {
      toggleConfirmBtn.addEventListener('click', () => {
        pw2Visible = !pw2Visible;
        pdfPasswordConfirm.type = pw2Visible ? 'text' : 'password';
        eyeIcon2.classList.toggle('hidden', pw2Visible);
        eyeSlashIcon2.classList.toggle('hidden', !pw2Visible);
      });
    }

    // Password strength computation
    function evaluatePasswordStrength(pw) {
      if (!pw || pw.length === 0) {
        return { label: 'Enter password', color: 'bg-stone-300', width: '0%', textColor: 'text-stone-500' };
      }
      let score = 0;
      if (pw.length >= 4) score += 1;
      if (pw.length >= 8) score += 1;
      if (/[A-Z]/.test(pw)) score += 1;
      if (/[0-9]/.test(pw)) score += 1;
      if (/[^A-Za-z0-9]/.test(pw)) score += 1;

      if (score <= 1) {
        return { label: 'Weak', color: 'bg-rose-500', width: '25%', textColor: 'text-rose-600 dark:text-rose-400' };
      } else if (score <= 3) {
        return { label: 'Moderate', color: 'bg-amber-500', width: '60%', textColor: 'text-amber-600 dark:text-amber-400' };
      } else {
        return { label: 'Strong', color: 'bg-emerald-500', width: '100%', textColor: 'text-emerald-600 dark:text-emerald-400' };
      }
    }

    function checkPasswordMatch() {
      const p1 = pdfPasswordInput.value;
      const p2 = pdfPasswordConfirm.value;

      const strength = evaluatePasswordStrength(p1);
      passwordStrengthBadge.textContent = strength.label;
      passwordStrengthBadge.className = `text-[11px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full ${strength.textColor} bg-stone-100 dark:bg-stone-800`;
      strengthBar.className = `h-full ${strength.color} transition-all duration-300`;
      strengthBar.style.width = strength.width;

      if (!p2) {
        passwordMatchText.textContent = "Please enter the same password in both fields.";
        passwordMatchText.className = "mt-1.5 text-xs text-stone-500 dark:text-stone-400";
        return;
      }

      if (p1 === p2) {
        passwordMatchText.textContent = "✓ Passwords match!";
        passwordMatchText.className = "mt-1.5 text-xs font-semibold text-emerald-600 dark:text-emerald-400";
      } else {
        passwordMatchText.textContent = "✕ Passwords do not match.";
        passwordMatchText.className = "mt-1.5 text-xs font-semibold text-rose-600 dark:text-rose-400";
      }
    }

    pdfPasswordInput.addEventListener('input', checkPasswordMatch);
    pdfPasswordConfirm.addEventListener('input', checkPasswordMatch);

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function showAlert(type, message) {
      alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-800', 'border-red-200', 'dark:bg-red-950/40', 'dark:text-red-300', 'dark:border-red-800', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200', 'dark:bg-emerald-950/40', 'dark:text-emerald-300', 'dark:border-emerald-800', 'bg-amber-50', 'text-amber-800', 'border-amber-200', 'dark:bg-amber-950/40', 'dark:text-amber-300', 'dark:border-amber-800');
      
      if (type === 'error') {
        alertBox.classList.add('bg-red-50', 'text-red-800', 'border-red-200', 'dark:bg-red-950/40', 'dark:text-red-300', 'dark:border-red-800');
        alertIcon.innerHTML = `<svg class="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>`;
      } else if (type === 'success') {
        alertBox.classList.add('bg-emerald-50', 'text-emerald-800', 'border-emerald-200', 'dark:bg-emerald-950/40', 'dark:text-emerald-300', 'dark:border-emerald-800');
        alertIcon.innerHTML = `<svg class="w-5 h-5 text-emerald-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>`;
      } else {
        alertBox.classList.add('bg-amber-50', 'text-amber-800', 'border-amber-200', 'dark:bg-amber-950/40', 'dark:text-amber-300', 'dark:border-amber-800');
        alertIcon.innerHTML = `<svg class="w-5 h-5 text-amber-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>`;
      }
      alertMessage.textContent = message;
    }

    function hideAlert() {
      alertBox.classList.add('hidden');
    }

    // Inspect and process incoming file
    async function handleIncomingFile(file) {
      try {
        currentFileName = file.name || 'document.pdf';
        currentFileSize = file.size || 0;
        currentFileBuffer = await file.arrayBuffer();

        fileNameText.textContent = currentFileName;
        fileSizeText.textContent = `${formatBytes(currentFileSize)} • Checking file...`;
        hideAlert();
        pdfPasswordInput.value = '';
        pdfPasswordConfirm.value = '';
        checkPasswordMatch();

        // Switch to active workbench
        emptyDropzone.classList.add('hidden');
        successPanel.classList.add('hidden');
        activeWorkbench.classList.remove('hidden');

        // Check if incoming document is already password protected
        let isAlreadyLocked = false;
        try {
          const loadingTask = pdfjsLib.getDocument({
            data: new Uint8Array(currentFileBuffer.slice(0)),
            password: ''
          });
          const pdfDoc = await loadingTask.promise;
          currentNumPages = pdfDoc.numPages;

          // Check if it already has an encryption trailer
          try {
            const testLibDoc = await PDFLib.PDFDocument.load(currentFileBuffer.slice(0), { ignoreEncryption: true });
            if (testLibDoc.context.trailerInfo?.Encrypt || testLibDoc.isEncrypted) {
              isAlreadyLocked = true;
            }
          } catch (e) {
            isAlreadyLocked = true;
          }
        } catch (err) {
          if (err.name === 'PasswordException' || err.code === 1 || err.code === 2 || err.message?.toLowerCase().includes('password')) {
            isAlreadyLocked = true;
          }
        }

        if (isAlreadyLocked) {
          showAlert('info', 'This document is already password-protected. If you want to change or remove its password, please use the Unlock PDF tool.');
          fileSizeText.textContent = `${formatBytes(currentFileSize)} • Password Protected Document`;
        } else {
          fileSizeText.textContent = `${formatBytes(currentFileSize)} • ${currentNumPages} Page${currentNumPages > 1 ? 's' : ''} • Ready to Protect`;
          pdfPasswordInput.focus();
        }

      } catch (err) {
        console.error('Error reading PDF:', err);
        showAlert('error', 'Unable to parse this PDF file. Please ensure the file is a valid PDF document.');
      }
    }

    // Smart File Name Sanitizer
    function sanitizeBaseName(rawName) {
      if (!rawName) return 'Document';
      let clean = rawName.replace(/\.pdf$/i, '').trim();

      // Detect hex hashes (8+ consecutive hex characters) or UUIDs or excessively long names
      const hasLongHex = /[0-9a-fA-F]{8,}/.test(clean);
      const hasUuid = /[0-9a-fA-F]{8}-[0-9a-fA-F]{4}/.test(clean);
      const isTooLong = clean.length > 20;

      if (hasLongHex || hasUuid || isTooLong) {
        const parts = clean.split(/[_\-\s]+/).filter(p => 
          !/[0-9a-fA-F]{8,}/.test(p) && 
          !/^[0-9]+$/.test(p) && 
          p.length >= 3 && 
          p.length <= 15
        );
        if (parts.length > 0) {
          const candidate = parts[0].replace(/[^a-zA-Z0-9]/g, '');
          if (candidate.length >= 3 && candidate.length <= 15) {
            return candidate.charAt(0).toUpperCase() + candidate.slice(1);
          }
        }
        return 'Document';
      }

      clean = clean.replace(/[^a-zA-Z0-9_-]/g, '_').replace(/_+/g, '_').replace(/^_+|_+$/g, '');
      if (clean.length === 0 || clean.length > 15) {
        return 'Document';
      }
      return clean.charAt(0).toUpperCase() + clean.slice(1);
    }

    // Execute Client-Side Encryption Engine (jsPDF + PDF.js ISO 32000 Engine)
    async function executeProtection() {
      hideAlert();
      const pw1 = pdfPasswordInput.value;
      const pw2 = pdfPasswordConfirm.value;

      if (!pw1 || pw1.length < 4) {
        showAlert('error', 'Password must be at least 4 characters long.');
        pdfPasswordInput.focus();
        return;
      }
      if (pw1 !== pw2) {
        showAlert('error', 'Passwords do not match. Please verify and re-enter.');
        pdfPasswordConfirm.focus();
        return;
      }

      protectActionBtn.disabled = true;
      protectBtnText.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Encrypting in RAM...
      `;

      try {
        let encryptedBytes = null;
        let numPages = currentNumPages || 1;

        // METHOD 1: High-Performance Native ISO 32000 PDF Encryption Engine
        // Preserves 100% vector text, searchable text, bookmarks, embedded fonts, and exact quality
        if (window.PDFEncrypt && typeof window.PDFEncrypt.encryptPDF === 'function') {
          protectBtnText.innerHTML = `
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Securing with AES-256...
          `;

          try {
            const hasSubtle = window.crypto && window.crypto.subtle;
            encryptedBytes = await window.PDFEncrypt.encryptPDF(
              new Uint8Array(currentFileBuffer.slice(0)),
              pw1,
              {
                ownerPassword: pw1,
                algorithm: hasSubtle ? 'AES-256' : 'RC4',
                allowPrinting: true,
                allowCopying: false,
                allowModifying: false
              }
            );
          } catch (aesErr) {
            console.warn('AES-256 attempt notice, trying RC4 compatibility mode:', aesErr);
            encryptedBytes = await window.PDFEncrypt.encryptPDF(
              new Uint8Array(currentFileBuffer.slice(0)),
              pw1,
              {
                ownerPassword: pw1,
                algorithm: 'RC4',
                allowPrinting: true,
                allowCopying: false,
                allowModifying: false
              }
            );
          }
        }

        // METHOD 2: Fallback to jsPDF Multi-Page Renderer if PDFEncrypt is unavailable
        if (!encryptedBytes) {
          const loadingTask = pdfjsLib.getDocument({
            data: new Uint8Array(currentFileBuffer.slice(0))
          });
          const srcPdf = await loadingTask.promise;
          numPages = srcPdf.numPages;

          const { jsPDF } = window.jspdf;
          let encryptedDoc = null;

          for (let pageNum = 1; pageNum <= numPages; pageNum++) {
            protectBtnText.innerHTML = `
              <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Encrypting Page ${pageNum} of ${numPages}...
            `;

            const page = await srcPdf.getPage(pageNum);
            const orig = page.getViewport({ scale: 1.0 });
            const orientation = orig.width > orig.height ? 'landscape' : 'portrait';

            const renderScale = 2.0;
            const renderViewport = page.getViewport({ scale: renderScale });
            const canvas = document.createElement('canvas');
            canvas.width = Math.floor(renderViewport.width);
            canvas.height = Math.floor(renderViewport.height);
            const ctx = canvas.getContext('2d', { alpha: false });
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            await page.render({
              canvasContext: ctx,
              viewport: renderViewport
            }).promise;

            const imgData = canvas.toDataURL('image/jpeg', 0.95);

            if (pageNum === 1) {
              encryptedDoc = new jsPDF({
                orientation: orientation,
                unit: 'pt',
                format: [orig.width, orig.height],
                encryption: {
                  userPassword: pw1,
                  ownerPassword: pw1,
                  userPermissions: ['print', 'copy']
                }
              });
              encryptedDoc.addImage(imgData, 'JPEG', 0, 0, orig.width, orig.height, undefined, 'FAST');
            } else {
              encryptedDoc.addPage([orig.width, orig.height], orientation);
              encryptedDoc.addImage(imgData, 'JPEG', 0, 0, orig.width, orig.height, undefined, 'FAST');
            }
          }

          encryptedBytes = encryptedDoc.output('arraybuffer');
        }
        const blob = new Blob([encryptedBytes], { type: 'application/pdf' });
        const downloadUrl = URL.createObjectURL(blob);

        // Step 4: Configure Branded File Naming
        const shortCleanName = sanitizeBaseName(currentFileName);
        const defaultBaseName = `SlowPDF_Protected_${shortCleanName}`;

        function computeFinalFileName() {
          let userVal = (outputFilenameInput && outputFilenameInput.value ? outputFilenameInput.value.trim() : '') || defaultBaseName;
          userVal = userVal.replace(/(\.pdf)+$/i, '').trim();
          if (!userVal) userVal = defaultBaseName;
          return `${userVal}.pdf`;
        }

        if (outputFilenameInput) {
          outputFilenameInput.value = defaultBaseName;
          outputFilenameInput.oninput = () => {
            const currentName = computeFinalFileName();
            downloadProtectedBtn.download = currentName;
            downloadProtectedBtn.setAttribute('download', currentName);
            protectedFileName.textContent = currentName;
          };
        }

        const finalDownloadName = computeFinalFileName();
        downloadProtectedBtn.href = downloadUrl;
        downloadProtectedBtn.download = finalDownloadName;
        downloadProtectedBtn.setAttribute('download', finalDownloadName);
        protectedFileName.textContent = finalDownloadName;
        protectedFileStats.textContent = `${formatBytes(encryptedBytes.byteLength)} • ${numPages} Page${numPages > 1 ? 's' : ''} • Fully Encrypted`;

        downloadProtectedBtn.onclick = () => {
          const latestName = computeFinalFileName();
          downloadProtectedBtn.download = latestName;
          downloadProtectedBtn.setAttribute('download', latestName);
        };

        // Switch to success view
        activeWorkbench.classList.add('hidden');
        successPanel.classList.remove('hidden');

      } catch (err) {
        console.error('Encryption failed:', err);
        showAlert('error', 'An unexpected error occurred while encrypting your document. Please verify the file.');
      } finally {
        protectActionBtn.disabled = false;
        protectBtnText.textContent = 'Encrypt & Protect PDF';
      }
    }

    protectActionBtn.addEventListener('click', executeProtection);

    [pdfPasswordInput, pdfPasswordConfirm].forEach(input => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') executeProtection();
      });
    });

    // Reset workbench
    resetWorkbenchBtn.addEventListener('click', () => {
      currentFileBuffer = null;
      currentFileName = '';
      currentFileSize = 0;
      currentNumPages = 0;
      pdfPasswordInput.value = '';
      pdfPasswordConfirm.value = '';
      checkPasswordMatch();
      successPanel.classList.add('hidden');
      activeWorkbench.classList.add('hidden');
      emptyDropzone.classList.remove('hidden');
    });

    // ----------------------------------------------------
    // 4. ACCORDION FAQ LOGIC
    // ----------------------------------------------------
    document.querySelectorAll('.faq-item').forEach(item => {
      const trigger = item.querySelector('.faq-trigger');
      const content = item.querySelector('.faq-content');
      const icon = item.querySelector('.faq-icon svg');

      trigger.addEventListener('click', () => {
        const isOpen = !content.classList.contains('hidden');
        if (isOpen) {
          content.classList.add('hidden');
          icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>';
          item.classList.remove('ring-1', 'ring-[#355E4B]');
        } else {
          content.classList.remove('hidden');
          icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"/>';
          item.classList.add('ring-1', 'ring-[#355E4B]');
        }
      });
    });

    const toggleFaqsBtn = document.getElementById('toggle-faqs-btn');
    const extraFaqs = document.getElementById('extra-faqs');
    const faqBtnText = document.getElementById('faq-btn-text');
    const faqChevron = document.getElementById('faq-chevron');
    let faqsExpanded = false;

    if (toggleFaqsBtn && extraFaqs) {
      toggleFaqsBtn.addEventListener('click', () => {
        faqsExpanded = !faqsExpanded;
        if (faqsExpanded) {
          extraFaqs.classList.remove('hidden');
          faqBtnText.textContent = 'Show Fewer Questions';
          faqChevron.classList.add('rotate-180');
        } else {
          extraFaqs.classList.add('hidden');
          faqBtnText.textContent = 'View All 10 Questions';
          faqChevron.classList.remove('rotate-180');
        }
      });
    }
  </script>
</body>
</html>
